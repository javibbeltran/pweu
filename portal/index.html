<!doctype html>
<html lang="en" data-theme="auto"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121513">
<title>Precious Woods · Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="pw.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
</head>
<body>

<div id="gate"><div class="gcard">
  <p class="gmark">Precious Woods</p>
  <p class="gseg">Operations</p>
  <p id="gatemsg">Checking your access…</p>
</div></div>

<header class="bar">
  <div class="in">
    <a class="brand" href="index.html">
      <span class="mark">Precious Woods</span>
      <span class="seg" id="seg">Operations</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <span class="sp"></span>
    <div class="search">
      <input id="q" type="search" autocomplete="off" placeholder="Search">
      <div class="results" id="res"></div>
    </div>
    <button class="ghost" id="userbtn" aria-expanded="false" aria-haspopup="true">
      <span class="av" id="av">··</span>
      <span id="userlbl"></span>
    </button>
  </div>
</header>
<div class="mega" id="mega"></div>

<div class="panel" id="panel" role="menu"></div>

<main class="page">
  <div class="lede">
    <h1 id="h1"></h1>
    <span class="pill" id="pill"></span>
  </div>
  <div id="body"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(...a)=>PW.t(...a);

let SPACES=[],SECTIONS=[],DOCS=[],ROLES={},CUR=null;

const ACCENTS=['#2f7d55','#3c6e4f','#6b7f3a','#8a6a3b','#3a6b7d','#7d4f3a'];

/* ---------- access screen ---------- */
function gate(html){const g=$('gate');g.innerHTML=html;g.style.display='flex'}
function ungate(){$('gate').style.display='none'}

function gateShell(inner){
  return '<div class="gcard"><p class="gmark">Precious Woods</p><p class="gseg">Operations</p>'
    +inner
    +'<div class="glang"><select id="glang">'
    + PW.LANGS.map(([c,n])=>'<option value="'+c+'"'+(c===PW.prefs.lang?' selected':'')+'>'+n+'</option>').join('')
    +'</select></div></div>';
}
function wireGateLang(redraw){
  const s=$('glang');
  if(s) s.onchange=()=>{PW.setPref('lang',s.value);document.documentElement.lang=s.value;redraw()};
}

function loginScreen(msg){
  gate(gateShell(
     '<p>'+esc(t('loginLead'))+'</p>'
    +'<form id="gf"><input id="gmail" type="email" required placeholder="'+esc(t('emailLabel'))+'" autocomplete="email">'
    +'<button type="submit">'+esc(t('sendLink'))+'</button></form>'
    +'<p class="gmsg" id="gmsg">'+(msg?esc(msg):'')+'</p>'));
  wireGateLang(()=>loginScreen(msg));
  $('gf').addEventListener('submit',async e=>{
    e.preventDefault();
    const em=$('gmail').value.trim(),m=$('gmsg');
    m.textContent=t('sending');
    const {error}=await PW.signIn(em);
    m.textContent=error?t('sendFail',error.message):t('sent',em);
  });
}

function noAccessScreen(){
  gate(gateShell(
     '<h2>'+esc(t('noAccessT'))+'</h2>'
    +'<p>'+esc(t('noAccessB',PW.email))+'</p>'
    +'<p>'+esc(t('noAccessH'))+'</p>'
    +'<button id="out2">'+esc(t('signout'))+'</button>'));
  wireGateLang(noAccessScreen);
  $('out2').onclick=async()=>{await PW.signOut();location.reload()};
}

/* ---------- preferences panel ---------- */
function initials(em){
  const n=em.split('@')[0].replace(/[._-]+/g,' ').trim().split(' ').filter(Boolean);
  return ((n[0]||'?')[0]+((n[1]||'')[0]||'')).toUpperCase();
}

function panel(){
  const p=$('panel');
  const spaceRow = SPACES.length>1
    ? '<h4>'+esc(t('company'))+'</h4><select id="pspace">'
      + SPACES.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===CUR?' selected':'')+'>'+esc(s.name)+'</option>').join('')
      + '</select>'
    : '';
  p.innerHTML =
     '<div class="who"><b>'+esc(PW.email)+'</b><span>'
      +esc(ROLES[CUR]==='editor'?t('canEdit'):t('readOnly'))+'</span></div>'
    + spaceRow
    + '<h4>'+esc(t('language'))+'</h4><select id="plang">'
      + PW.LANGS.map(([c,n])=>'<option value="'+c+'"'+(c===PW.prefs.lang?' selected':'')+'>'+n+'</option>').join('')
      + '</select>'
    + '<h4>'+esc(t('appearance'))+'</h4><div class="seg3">'
      + [['system',t('system')],['light',t('light')],['dark',t('dark')]]
        .map(([v,l])=>'<button data-theme="'+v+'" aria-pressed="'+(PW.prefs.theme===v)+'">'+esc(l)+'</button>').join('')
      + '</div>'
    + '<h4>'+esc(t('accent'))+'</h4><div class="swatches">'
      + ACCENTS.map(c=>'<button data-acc="'+c+'" style="background:'+c+'" aria-pressed="'
          +(PW.prefs.accent.toLowerCase()===c)+'" title="'+c+'"></button>').join('')
      + '<input type="color" id="pacc" value="'+esc(PW.prefs.accent)+'">'
      + '</div>'
    + '<div class="foot"><button id="pout">'+esc(t('signout'))+'</button></div>';

  const sp=$('pspace');
  if(sp) sp.onchange=()=>{CUR=sp.value;PW.setPref('space',CUR);buildNav();closeMega();render();panel()};
  $('plang').onchange=e=>{PW.setPref('lang',e.target.value);document.documentElement.lang=e.target.value;chrome();render();panel()};
  p.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{PW.setPref('theme',b.dataset.theme);panel()});
  p.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{PW.setPref('accent',b.dataset.acc);panel()});
  $('pacc').oninput=e=>{PW.setPref('accent',e.target.value)};
  $('pout').onclick=async()=>{await PW.signOut();location.reload()};
}

function togglePanel(open){
  const p=$('panel'),b=$('userbtn');
  const show = open===undefined ? !p.classList.contains('open') : open;
  p.classList.toggle('open',show);
  b.setAttribute('aria-expanded',String(show));
}


/* ---------- main navigation ---------- */
const NAVORDER=['operations','commercial','compliance','projects','systems'];
function navLabel(k){ const v=t('nav'+k); return v==='nav'+k ? k.charAt(0).toUpperCase()+k.slice(1) : v }

function groupsOf(space){
  const g={};
  SECTIONS.filter(s=>s.space===space).forEach(s=>{
    const k=s.nav||'operations';
    (g[k]=g[k]||[]).push(s);
  });
  return Object.keys(g)
    .sort((a,b)=>{
      const ia=NAVORDER.indexOf(a),ib=NAVORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    })
    .map(k=>({key:k,label:navLabel(k),sections:g[k].sort((a,b)=>a.sort-b.sort)}));
}

function buildNav(){
  const gs=groupsOf(CUR);
  $('nav').innerHTML=gs.map(g=>
    '<button data-nav="'+esc(g.key)+'" aria-expanded="false">'+esc(g.label)
    +'<span class="caret">\u25be</span></button>').join('');
  $('nav').querySelectorAll('button').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();openMega(b.dataset.nav,b)};
    b.onmouseenter=()=>{ if($('mega').classList.contains('open')) openMega(b.dataset.nav,b) };
  });
}

function openMega(key,btn){
  const m=$('mega');
  if(btn && btn.getAttribute('aria-expanded')==='true'){ closeMega(); return }
  const g=groupsOf(CUR).find(x=>x.key===key);
  if(!g){ closeMega(); return }
  m.innerHTML='<div class="in">'+g.sections.map(sec=>{
    const list=DOCS.filter(d=>d.section===sec.id).sort((a,b)=>a.sort-b.sort);
    return '<div class="col"><h5>'+esc(sec.name)+'</h5>'
      +(list.length?list.slice(0,6).map(d=>{
          const href=(d.kind==='link'&&d.url)?esc(d.url):'doc.html?doc='+encodeURIComponent(d.slug);
          const tgt=(d.kind==='link'&&d.url)?' target="_blank" rel="noopener"':'';
          return '<a href="'+href+'"'+tgt+'>'+esc(d.title)
            +(d.subtitle?'<span class="sub">'+esc(d.subtitle)+'</span>':'')+'</a>';
        }).join('')
       :'<p class="none">'+esc(t('nothingHere'))+'</p>')
      +(list.length>6?'<a class="all" href="#sec-'+esc(sec.id)+'">'+esc(t('openAll'))+'</a>':'')
      +'</div>';
  }).join('')+'</div>';
  m.classList.add('open');
  $('nav').querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-expanded',String(b.dataset.nav===key)));
}
function closeMega(){
  $('mega').classList.remove('open');
  $('nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-expanded','false'));
}

/* ---------- search ---------- */
function search(term){
  const r=$('res'),q=term.trim().toLowerCase();
  if(!q){r.classList.remove('open');return}
  const secName=id=>{const s=SECTIONS.find(x=>x.id===id);return s?s.name:''};
  const spName=id=>{const s=SPACES.find(x=>x.id===id);return s?s.name:''};
  const hits=DOCS.filter(d=>
    (d.title||'').toLowerCase().includes(q) ||
    (d.subtitle||'').toLowerCase().includes(q) ||
    secName(d.section).toLowerCase().includes(q)).slice(0,10);
  r.innerHTML=hits.length
    ? hits.map(d=>{
        const href=(d.kind==='link'&&d.url)?esc(d.url):'doc.html?doc='+encodeURIComponent(d.slug);
        return '<a href="'+href+'">'+esc(d.title)
          +'<span class="where">'+esc(spName(d.space))+' · '+esc(secName(d.section))+'</span></a>';
      }).join('')
    : '<p class="none">'+esc(t('noResults'))+'</p>';
  r.classList.add('open');
}

/* ---------- content ---------- */
function fmtDate(s){
  if(!s) return '';
  try{ return new Date(s).toLocaleDateString(PW.prefs.lang,{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return new Date(s).toLocaleDateString(); }
}

function card(d){
  const vacio = !d.has_content && d.kind==='diagram';
  const meta = vacio ? t('noContent')
    : (d.updated_at ? t('updated')+' '+fmtDate(d.updated_at)
        + (d.updated_by?' · '+esc(d.updated_by.split('@')[0]):'') : '');
  const inner =
     '<p class="t">'+esc(d.title)
      +(vacio?' <span class="tag">'+esc(t('empty'))+'</span>':'')
      +(d.kind==='link'?' <span class="tag">'+esc(t('link'))+'</span>':'')+'</p>'
    +(d.subtitle?'<p class="d">'+esc(d.subtitle)+'</p>':'')
    +(meta?'<p class="m">'+meta+'</p>':'');
  if(d.kind==='link'&&d.url)
    return '<a class="card" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+inner+'</a>';
  if(vacio && ROLES[d.space]!=='editor') return '<div class="card empty">'+inner+'</div>';
  return '<a class="card'+(vacio?' empty':'')+'" href="doc.html?doc='+encodeURIComponent(d.slug)+'">'+inner+'</a>';
}

function chrome(){
  $('seg').textContent=t('portal');
  $('userlbl').textContent='';
  $('av').textContent=initials(PW.email||'?');
  document.title='Precious Woods · '+t('portal');
  $('q').placeholder=t('searchPh');
  buildNav();
}

function render(){
  const sp=SPACES.find(s=>s.id===CUR);
  $('h1').textContent=sp?sp.name:'';
  $('pill').textContent=ROLES[CUR]==='editor'?t('canEdit'):t('readOnly');
  const secs=SECTIONS.filter(s=>s.space===CUR);
  const ds=DOCS.filter(d=>d.space===CUR);
  if(!secs.length){$('body').innerHTML='<p class="none">'+esc(t('noSections'))+'</p>';return}
  $('body').innerHTML=secs.map(s=>{
    const list=ds.filter(d=>d.section===s.id).sort((a,b)=>a.sort-b.sort);
    return '<section class="sec" id="sec-'+esc(s.id)+'"><h2>'+esc(s.name)+'</h2>'
      +(list.length?'<div class="grid">'+list.map(card).join('')+'</div>'
                   :'<p class="none">'+esc(t('nothingHere'))+'</p>')
      +'</section>';
  }).join('');
}

/* ---------- start ---------- */
(async()=>{
  document.documentElement.lang=PW.prefs.lang;
  $('gatemsg').textContent=t('checking');

  const c=await PW.connect();
  if(!c.ok){
    gate(gateShell('<h2>'+esc(t('offlineT'))+'</h2><p>'+esc(t('offlineB'))+'</p>'
      +'<button onclick="location.reload()">'+esc(t('retry'))+'</button>'));
    wireGateLang(()=>location.reload());
    return;
  }
  if(!c.session){ loginScreen(); return; }

  await PW.loadPrefs();
  document.documentElement.lang=PW.prefs.lang;

  const [sp,se,dc]=await Promise.all([
    PW.sb.from('spaces').select('id,name,sort').order('sort'),
    PW.sb.from('sections').select('id,space,name,icon,sort').order('sort'),
    PW.sb.from('doc_index').select('*')
  ]);
  if(sp.error){ loginScreen(t('loadFail',sp.error.message)); return; }
  SPACES=sp.data||[]; SECTIONS=se.data||[]; DOCS=dc.data||[];
  if(!SPACES.length){ noAccessScreen(); return; }

  const rs=await Promise.all(SPACES.map(s=>PW.sb.rpc('role_in',{p_space:s.id})));
  SPACES.forEach((s,i)=>{ROLES[s.id]=(rs[i]&&rs[i].data)||'viewer'});

  const want=new URLSearchParams(location.search).get('space')||PW.prefs.space;
  CUR=(SPACES.find(s=>s.id===want)||SPACES[0]).id;
  if(PW.prefs.space!==CUR) PW.setPref('space',CUR);

  ungate(); chrome(); panel(); render();

  $('q').addEventListener('input',e=>search(e.target.value));
  $('q').addEventListener('focus',e=>{if(e.target.value)search(e.target.value)});
  $('res').onclick=e=>e.stopPropagation();
  $('mega').onclick=e=>e.stopPropagation();
  $('userbtn').onclick=e=>{e.stopPropagation();togglePanel();closeMega()};
  $('panel').onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>{togglePanel(false);closeMega();$('res').classList.remove('open')});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){togglePanel(false);closeMega();$('res').classList.remove('open');$('q').blur()}
  });
})();
</script>
</body></html>

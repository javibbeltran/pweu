<meta name="robots" content="noindex,nofollow">
<title>PWEU Sales Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Tinos:wght@400;700&display=swap">
<style>
/* ============================================================
   Precious Woods · Operations portal — shared styling
   Forest greens, warm neutrals, a quiet serif for headings.
   ============================================================ */

:root{
  --accent:#00A65C;
  --radius:10px;
  --maxw:1060px;
  --serif:Mulish,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:Mulish,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* dark is the default; light only when asked for, or when the system says so */
.brand{gap:9px}
.brand .mk{height:24px;width:auto;display:block;flex:none}
@media (max-width:640px){.brand .mk{height:21px}}

:root,
:root[data-theme="dark"]{
  --ink:#35C27E;
  --bg:#121513;      --bg2:#171b18;
  --surf:#1b201d;    --surf2:#222824;
  --ln:#2b322d;      --ln2:#3a433d;
  --fg:#e9ece9;      --fg2:#c3cac5;
  --mut:#8d9a93;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ink:#00743F;
  --bg:#f6f5f2;      --bg2:#efeeea;
  --surf:#ffffff;    --surf2:#faf9f7;
  --ln:#e0ded8;      --ln2:#c9c6bd;
  --fg:#1a1f1c;      --fg2:#39413b;
  --mut:#5f6b64;
  --shadow:0 1px 2px rgba(26,31,28,.07);
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    --ink:#00743F;
    --bg:#f6f5f2;    --bg2:#efeeea;
    --surf:#ffffff;  --surf2:#faf9f7;
    --ln:#e0ded8;    --ln2:#c9c6bd;
    --fg:#1a1f1c;    --fg2:#39413b;
    --mut:#5f6b64;
    --shadow:0 1px 2px rgba(26,31,28,.07);
  }
}

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:41;background:var(--bg);
  border-bottom:1px solid var(--ln);
}
.bar .in{
  max-width:var(--maxw);margin:0 auto;padding:0 22px;
  height:58px;display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;min-width:0}
.brand .mark{
  font-family:Tinos,Georgia,serif;font-size:16px;font-weight:700;
  letter-spacing:.055em;text-transform:uppercase;
  white-space:nowrap;
}
.brand .seg{
  font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--mut);
  white-space:nowrap;padding-left:10px;border-left:1px solid var(--ln);
}
.bar .sp{flex:1}


/* ---------- page ---------- */
.page{max-width:var(--maxw);margin:0 auto;padding:30px 22px 80px}
.lede{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 30px}
.lede h1{font-family:var(--serif);font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;letter-spacing:-.01em}
.lede .pill{
  font-size:11px;color:var(--mut);border:1px solid var(--ln);border-radius:999px;padding:3px 10px;
}

section.sec{margin:0 0 34px}
section.sec h2{
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);
  margin:0 0 13px;font-weight:600;padding-bottom:9px;border-bottom:1px solid var(--ln);
}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}

.card{
  display:block;text-decoration:none;color:inherit;background:var(--surf);
  border:1px solid var(--ln);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow);transition:border-color .13s,transform .13s;
}
a.card:hover{border-color:var(--ln2);transform:translateY(-1px)}
.card .t{
  font-size:14.5px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;line-height:1.35;
}
.card .d{font-size:13px;color:var(--fg2);margin:0;line-height:1.5}
.card .m{font-size:11.5px;color:var(--mut);margin:11px 0 0}
.card.empty{background:none;border-style:dashed;box-shadow:none}
.card.empty .t{color:var(--fg2)}
.tag{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  border:1px solid var(--ln2);border-radius:999px;padding:2px 7px;color:var(--mut);
}
.none{
  color:var(--mut);font-size:13px;border:1px dashed var(--ln);border-radius:var(--radius);
  padding:17px;margin:0;
}

/* ---------- access screen ---------- */
#gate{
  position:fixed;inset:0;z-index:999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
#gate .gcard{
  max-width:400px;width:100%;background:var(--surf);border:1px solid var(--ln);
  border-radius:14px;padding:30px 26px;text-align:center;box-shadow:var(--shadow);
}
#gate .gmark{
  font-family:Tinos,Georgia,serif;font-size:17px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;margin:0 0 5px;
}
#gate .gseg{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--mut);margin:0 0 18px;
}
#gate h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 10px}
#gate p{margin:0 0 15px;font-size:13.5px;color:var(--mut);line-height:1.55}
#gate form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#gate input[type=email]{
  flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--ln);color:var(--fg);
  border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;
}
#gate input[type=email]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
#gate button{
  background:var(--accent);border:0;color:#fff;border-radius:8px;padding:10px 17px;
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;
}
#gate button:hover{filter:brightness(1.08)}
#gate .gmsg{margin:15px 0 0;min-height:18px;font-size:12.5px;color:var(--mut)}
#gate .glang{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--ln)}
#gate .glang select{
  background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;
}

@media (max-width:640px){
  .bar .in{padding:0 14px;height:54px;gap:10px}
  .navbar .in{padding:0 14px;height:42px}
  .nav button{padding:0 12px;font-size:13px}
  .mega{top:96px}
  .brand .seg{display:none}
  .page{padding:22px 14px 70px}
  .lede h1{font-size:22px}
  .grid{grid-template-columns:1fr}
  .panel{right:10px;left:10px;width:auto;top:50px}
}

/* ---------- main navigation ---------- */
/* segunda fila: la navegacion, a todo lo ancho */
.navbar{border-top:1px solid var(--ln);background:var(--bg)}
.navbar .in{
  max-width:var(--maxw);margin:0 auto;padding:0 22px;height:44px;
  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.navbar .in::-webkit-scrollbar{display:none}
.nav{display:flex;align-items:stretch;gap:2px;height:100%}
.nav button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);
  font:inherit;font-size:13.5px;padding:0 15px;cursor:pointer;display:flex;align-items:center;
  gap:6px;white-space:nowrap;
}
.nav button:hover{color:var(--fg)}
.nav button[aria-expanded="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.nav button .caret{font-size:8px;opacity:.55;transform:translateY(1px)}

.mega{
  position:fixed;left:0;right:0;top:103px;z-index:45;display:none;
  background:var(--surf);border-bottom:1px solid var(--ln);
  box-shadow:0 16px 36px rgba(0,0,0,.26);
}
.mega.open{display:block}
.mega .in{
  max-width:var(--maxw);margin:0 auto;padding:22px 22px 24px;
  display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
}
.mega .col h5{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--mut);
  margin:0 0 9px;font-weight:600;padding-bottom:7px;border-bottom:1px solid var(--ln);
}
.mega .col a{
  display:block;text-decoration:none;color:var(--fg2);font-size:13.5px;
  padding:6px 8px;margin:0 -8px;border-radius:7px;line-height:1.4;
}
.mega .col a:hover{background:var(--surf2);color:var(--fg)}
.mega .col a .sub{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.mega .col .none{border:0;padding:5px 0;font-size:12.5px}
.mega .col a.all{color:var(--ink);font-size:12px;margin-top:4px}

/* search */
.search{position:relative;display:flex;align-items:center}
.search input{
  background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:999px;
  padding:7px 13px;font:inherit;font-size:13px;width:168px;transition:width .16s,border-color .16s;
}
.search input:focus{outline:none;border-color:var(--accent);width:230px}
.search input::placeholder{color:var(--mut)}
.results{
  position:absolute;top:40px;right:0;width:330px;background:var(--surf);
  border:1px solid var(--ln);border-radius:var(--radius);box-shadow:0 14px 34px rgba(0,0,0,.28);
  padding:6px;display:none;max-height:60vh;overflow:auto;z-index:70;
}
.results.open{display:block}
.results a{
  display:block;text-decoration:none;color:var(--fg2);font-size:13px;padding:8px 10px;border-radius:7px;
}
.results a:hover{background:var(--surf2);color:var(--fg)}
.results a .where{display:block;font-size:11px;color:var(--mut)}
.results .none{border:0;padding:10px;font-size:12.5px}

@media (max-width:900px){
  .search input{width:130px}
  .search input:focus{width:170px}
}
@media (max-width:640px){
  .results{width:auto;left:-120px;right:-8px}
}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:0 0 24px}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font:inherit;font-size:13.5px;padding:9px 15px;cursor:pointer;margin-bottom:-1px;
}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}

.split{display:grid;gap:22px;grid-template-columns:260px 1fr;align-items:start}
.list{border:1px solid var(--ln);border-radius:var(--radius);overflow:hidden;background:var(--surf)}
.list button{
  display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);
  color:var(--fg2);font:inherit;font-size:13px;padding:10px 13px;cursor:pointer;
}
.list button:last-child{border-bottom:0}
.list button:hover{background:var(--surf2);color:var(--fg)}
.list button[aria-current="true"]{background:var(--bg2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.list button small{display:block;color:var(--mut);font-size:11px;margin-top:2px}

.pane{border:1px solid var(--ln);border-radius:var(--radius);background:var(--surf);padding:18px}
.pane h3{font-size:15px;margin:0 0 3px;font-weight:600;word-break:break-all}
.pane .sub{color:var(--mut);font-size:12px;margin:0 0 18px}
.permrow{
  display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);
  flex-wrap:wrap;
}
.permrow:last-child{border-bottom:0}
.permrow .nm{flex:1;min-width:150px;font-size:13.5px}
.permrow .nm small{display:block;color:var(--mut);font-size:11px}
.permrow.ind .nm{padding-left:16px;font-size:13px;color:var(--fg2)}
.pick{display:flex;gap:3px}
.pick button{
  background:var(--surf2);border:1px solid var(--ln);color:var(--mut);font:inherit;font-size:11.5px;
  padding:4px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--bg2);font-weight:600}
.addrow{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.addrow input,.addrow select{
  background:var(--bg2);border:1px solid var(--ln);color:var(--fg);border-radius:8px;
  padding:8px 11px;font:inherit;font-size:13px;
}
.addrow input{flex:1;min-width:170px}
.addrow button{
  background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 15px;
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
}
.danger{color:#d2766c;border-color:#5a3733}

table.rows{width:100%;border-collapse:collapse;font-size:13px}
table.rows th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
  font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--ln);
}
table.rows td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
table.rows tr:last-child td{border-bottom:0}
table.rows .ref{font-weight:600;white-space:nowrap}
.state{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  border-radius:999px;padding:2px 8px;border:1px solid var(--ln2);color:var(--mut);white-space:nowrap;
}
.state.new{border-color:var(--accent);color:var(--accent)}
.state.approved{border-color:#4f8a63;color:#5fa377}
.state.rejected{border-color:#8a4f4f;color:#c0796f}
details.det summary{cursor:pointer;font-size:12px;color:var(--accent);margin-top:6px}
details.det pre{
  background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:11px;
  font-size:11.5px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;
}
.msg{font-size:12.5px;color:var(--mut);margin:12px 0 0;min-height:17px}

@media (max-width:820px){ .split{grid-template-columns:1fr} }

/* ============ dashboard ============ */
.hero{
  border-bottom:1px solid var(--ln);background:var(--bg2);
  margin:0 0 30px;padding:30px 0 26px;
}
.hero .in{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.hero .co{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  font-weight:700;margin:0 0 7px;
}
.hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;letter-spacing:-.01em}
.hero p.claim{color:var(--mut);font-size:14px;margin:0;max-width:56ch;line-height:1.55}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin:20px 0 0}
.facts div{font-size:12px;color:var(--mut);line-height:1.3}
.facts b{display:block;font-family:var(--serif);font-size:20px;color:var(--fg);font-weight:600}

.layout{display:grid;gap:26px;grid-template-columns:1fr 288px;align-items:start}

.quick{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 26px}
.quick a{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg);
  background:var(--surf);border:1px solid var(--ln);border-radius:999px;padding:8px 16px 8px 11px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow);
}
.quick a:hover{border-color:var(--accent)}
.quick a .ic{
  width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700;
}

h3.band{
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);
  margin:0 0 13px;font-weight:600;
}

.mods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.mod{
  text-align:left;background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);
  padding:16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);
  transition:border-color .13s,transform .13s;display:flex;flex-direction:column;gap:5px;min-height:112px;
}
.mod:hover{border-color:var(--accent);transform:translateY(-1px)}
.mod .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod .glyph{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
}
.mod .n{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.mod .nm{font-size:14.5px;font-weight:600;margin:6px 0 0}
.mod .meta{font-size:11.5px;color:var(--mut);margin-top:auto}
.mod .bar{height:2px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:9px}
.mod .bar i{display:block;height:100%;background:var(--accent)}

.side{display:flex;flex-direction:column;gap:22px;position:sticky;top:120px}
.widget{background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.widget h4{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--mut);
  margin:0 0 11px;font-weight:600;
}
.feed a{
  display:block;text-decoration:none;color:var(--fg2);font-size:13px;padding:7px 0;
  border-bottom:1px solid var(--ln);line-height:1.4;
}
.feed a:last-child{border-bottom:0}
.feed a:hover{color:var(--fg)}
.feed a span{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.stat{display:flex;align-items:baseline;gap:9px;margin:0 0 6px}
.stat b{font-family:var(--serif);font-size:26px;font-weight:600}
.stat span{font-size:12px;color:var(--mut)}
.widget .go{
  display:inline-block;margin-top:8px;font-size:12.5px;color:var(--ink);text-decoration:none;
}

/* ============ drawer ============ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .18s;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);
  border-left:1px solid var(--ln);z-index:81;transform:translateX(100%);
  transition:transform .22s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer header{
  display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--ln);
}
.drawer header h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:600}
.drawer header p{font-size:12px;color:var(--mut);margin:3px 0 0}
.drawer header button{
  margin-left:auto;background:none;border:1px solid var(--ln);color:var(--mut);border-radius:999px;
  width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;flex:none;
}
.drawer header button:hover{color:var(--fg);border-color:var(--ln2)}
.drawer .body{padding:16px 22px 28px;overflow:auto;display:flex;flex-direction:column;gap:10px}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:640px){
  .hero{padding:22px 0 20px;margin-bottom:22px}
  .hero .in{padding:0 14px}
  .hero h1{font-size:23px}
  .facts{gap:18px}
  .facts b{font-size:17px}
  .mods{grid-template-columns:1fr 1fr}
  .mod{min-height:98px;padding:13px}
}

.logo{height:26px;width:auto;display:block}
@media (max-width:640px){ .logo{height:22px} }

#gate .gmk{height:40px;width:auto;display:block;margin:0 auto 12px}
/* ============================================================
   Precious Woods portals — user button + settings panel.
   Shared by every page; pw.css imports it, doc.html links it.
   ============================================================ */

.ghost{
  background:none;border:1px solid transparent;color:var(--mut);
  font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.ghost:hover{color:var(--fg);background:var(--surf)}
.ghost[aria-expanded="true"]{color:var(--fg);background:var(--surf);border-color:var(--ln)}

.av{
  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none;
}

/* ---------- preferences panel ---------- */
.panel{
  position:absolute;right:22px;top:52px;z-index:60;width:286px;
  background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);
  box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px;display:none;
}
.panel.open{display:block}
.panel .who{padding:11px 12px 12px;border-bottom:1px solid var(--ln);margin:0 0 6px}
.panel .who b{display:block;font-size:13px;font-weight:600;word-break:break-all}
.panel .who span{font-size:11.5px;color:var(--mut)}
.panel h4{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--mut);
  margin:12px 10px 7px;font-weight:600;
}
.panel .row{display:flex;gap:5px;padding:0 8px 4px;flex-wrap:wrap}
.panel select{
  width:calc(100% - 16px);margin:0 8px 4px;background:var(--surf2);color:var(--fg);
  border:1px solid var(--ln);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;
}
.seg3{display:flex;gap:4px;padding:0 8px 4px;width:100%}
.seg3 button{
  flex:1;background:var(--surf2);border:1px solid var(--ln);color:var(--mut);
  font:inherit;font-size:12px;padding:6px 4px;border-radius:7px;cursor:pointer;
}
.seg3 button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--bg2)}
.swatches{display:flex;gap:7px;padding:2px 10px 8px;flex-wrap:wrap;align-items:center}
.swatches button{
  width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.swatches input[type=color]{
  width:22px;height:22px;padding:0;border:1px solid var(--ln);border-radius:50%;
  background:none;cursor:pointer;
}
.panel .foot{border-top:1px solid var(--ln);margin:8px 0 0;padding:6px 4px 2px}
.panel .foot button{
  width:100%;text-align:left;background:none;border:0;color:var(--mut);
  font:inherit;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer;
}
.panel .foot button:hover{background:var(--surf2);color:var(--fg)}

/* portal switcher inside the panel */
.panel .plist{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.panel .plist a{
  display:block;text-decoration:none;color:var(--fg2,var(--fg));font-size:13px;
  padding:7px 10px;border-radius:7px;
}
.panel .plist a:hover{background:var(--surf2);color:var(--fg)}
.panel .plist a[aria-current="page"]{background:var(--bg2);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}

.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 16px);margin:0 8px 4px;padding:0 12px;min-height:42px;background:var(--surf);border:1px solid var(--ln);border-radius:10px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.tgl i{position:relative;flex:none;width:36px;height:20px;border-radius:999px;background:var(--ln2);transition:background .12s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .12s}
.tgl[aria-pressed="true"] i{background:var(--accent)}
.tgl[aria-pressed="true"] i::after{transform:translateX(16px)}
/* ============================================================
   Precious Woods · Sales and Customer portals — extra styling
   Uses the colour variables of pw.css, so light / dark / accent
   all follow the settings panel.
   ============================================================ */

.lede + #content{margin-top:-6px}
h3.sub{font-size:13px;font-weight:600;color:var(--fg2);margin:20px 0 10px}

/* home tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{
  text-align:left;background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);
  padding:16px;font:inherit;color:inherit;cursor:pointer;min-height:96px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  transition:border-color .13s,transform .13s;
}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile-n{font-size:15px;font-weight:600}
.tile-s{
  align-self:flex-start;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  border:1px solid var(--ln2);border-radius:999px;padding:2px 8px;color:var(--mut);
}
.tile-s.ready{border-color:var(--accent);color:var(--ink)}

/* visible placeholders */
.todo{
  margin:22px 0 0;padding:14px 16px;border:1px dashed var(--ln2);border-radius:var(--radius);
  background:var(--bg2);color:var(--fg2);font-size:13px;
}
.todo-h{margin:0 0 8px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.todo-tag{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;
  border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:2px 8px;
}
.todo ul{margin:0;padding-left:18px;line-height:1.55}
.todo li{margin:2px 0}

/* species catalogue */
.sp-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 16px}
.sp-tools input{
  flex:1 1 240px;min-width:0;background:var(--surf);border:1px solid var(--ln);color:var(--fg);
  border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;min-height:44px;
}
.sp-tools input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.sp-chips{display:flex;gap:6px;flex-wrap:wrap}
.sp-chips button{
  background:var(--surf);border:1px solid var(--ln);color:var(--fg2);font:inherit;font-size:13px;
  border-radius:999px;padding:0 15px;min-height:44px;cursor:pointer;
}
.sp-chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--bg2);font-weight:600}
.sp-count{font-size:12px;color:var(--mut);margin-left:auto}

.sp-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.spc{
  background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.sp-ph{
  height:130px;background:repeating-linear-gradient(135deg,var(--bg2) 0,var(--bg2) 12px,var(--surf2) 12px,var(--surf2) 24px);
  display:flex;align-items:center;justify-content:center;color:var(--mut);
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;
}
.sp-ph img{width:100%;height:100%;object-fit:cover;display:block}
.sp-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px}
.sp-rg{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.spc h3{margin:2px 0 0;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.sp-bot{margin:0;font-style:italic;color:var(--fg2);font-size:13px}
.sp-ci{margin:0;color:var(--mut);font-size:12px}
.spc dl{margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.spc dt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.spc dd{margin:1px 0 0;font-size:13.5px;font-weight:500;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.spc dd small{flex-basis:100%;font-size:11px;font-weight:400;color:var(--mut)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--fg);flex:none}

@media (max-width:640px){
  .sp-grid{grid-template-columns:1fr}
  .sp-count{margin-left:0;flex-basis:100%}
}

/* ---------- shell with left menu ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.shell[hidden]{display:none}
.shell > .page{flex:1;min-width:0;max-width:none;margin:0}
.sidemenu{
  position:sticky;top:96px;flex:0 0 220px;margin:24px 0 0 16px;padding:12px;
  background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);
  display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 120px);overflow:auto;
}
.nosidebar .sidemenu,.shell.nosidebar .sidemenu{display:none}
.side-h{margin:2px 8px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--mut)}
.sidemenu button{
  text-align:left;background:none;border:0;color:var(--fg2);font:inherit;font-size:14px;
  padding:0 10px;min-height:40px;border-radius:8px;cursor:pointer;
}
.sidemenu button:hover{background:var(--bg2);color:var(--fg)}
.sidemenu button.on{background:var(--bg2);color:var(--fg);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.sidemenu button.sub{font-size:13px;padding-left:26px;min-height:36px}
@media (max-width:900px){.sidemenu{display:none}.shell{display:block}}

/* ---------- quick search ---------- */
.qs-box{position:relative;max-width:640px}
.qs-box input{
  width:100%;box-sizing:border-box;background:var(--surf);border:1px solid var(--ln);color:var(--fg);
  border-radius:999px;padding:12px 20px;font:inherit;font-size:16px;min-height:52px;
}
.qs-box input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.qs-res{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surf);border:1px solid var(--ln);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;
}
.qs-res[hidden]{display:none}
.qs-res button{
  display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;color:var(--fg);font:inherit;
  font-size:14px;padding:0 12px;min-height:44px;border-radius:8px;cursor:pointer;
}
.qs-res button:hover{background:var(--bg2)}
.qs-res i{color:var(--mut);font-size:12.5px}
.qs-res span{margin-left:auto;color:var(--mut);font-size:11px}
.qs-res .qs-all{color:var(--ink);font-weight:600;border-top:1px solid var(--ln);border-radius:0 0 8px 8px}
.qs-res .none{padding:10px 12px;margin:0}

/* ---------- catalogue filters ---------- */
.sp-tools select{
  background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:999px;
  padding:0 14px;font:inherit;font-size:14px;min-height:44px;
}
.sp-dd{position:relative}
.sp-dd summary{
  list-style:none;cursor:pointer;background:var(--surf);border:1px solid var(--ln);border-radius:999px;
  padding:0 16px;min-height:44px;display:flex;align-items:center;font-size:14px;color:var(--fg);
}
.sp-dd summary::-webkit-details-marker{display:none}
.sp-dd summary::after{content:"▾";margin-left:8px;color:var(--mut)}
.sp-dd[open] summary{border-color:var(--accent)}
.sp-dd-b{
  position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:250px;background:var(--surf);
  border:1px solid var(--ln);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;
}
.sp-dd-b button{
  text-align:left;background:none;border:0;color:var(--fg2);font:inherit;font-size:14px;min-height:42px;
  padding:0 12px;border-radius:8px;cursor:pointer;
}
.sp-dd-b button:hover{background:var(--bg2);color:var(--fg)}
.sp-dd-b button[aria-pressed="true"]{background:var(--bg2);color:var(--fg);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.sp-dd-b{max-height:60vh;overflow:auto}
.sample-b{margin:0 0 12px}
.sample-b span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:2px 9px}
.sp-clear{background:none;border:0;color:var(--ink);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 8px}
.sp-clear[hidden]{display:none}

/* ---------- card extras ---------- */
.sp-ph{position:relative}
.av-b{
  position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
  padding:3px 9px;border-radius:999px;background:var(--surf);border:1px solid var(--ln2);color:var(--fg2);
}
.av-stock{border-color:var(--accent);color:var(--ink)}
.av-produce{border-style:dashed;color:var(--fg)}
.sp-price{margin:8px 0 0;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.sp-price span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.sp-price.none{font-size:13px;font-weight:500;color:var(--mut)}
.sp-desc{margin:8px 0 0;font-size:13px;color:var(--fg2);line-height:1.45}
.sp-apps{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.sp-apps span{font-size:11px;border:1px solid var(--ln2);border-radius:999px;padding:2px 9px;color:var(--fg2)}

/* ---------- title as background watermark ---------- */
.shell > .page{position:relative;z-index:1}
.lede{margin:0;height:0}
.lede h1{
  position:fixed;right:28px;bottom:6px;margin:0;z-index:0;pointer-events:none;user-select:none;white-space:nowrap;
  font-size:clamp(36px,7.5vw,104px);max-width:96vw;overflow:hidden;font-weight:800;letter-spacing:-.03em;color:var(--fg);opacity:.05;
}
.sec,.sp-grid,.tiles{position:relative;z-index:1}
@media print{.lede h1{display:none}}

/* ---------- cart badge ---------- */
.cart-n{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:7px;
  border-radius:999px;background:#d92d20;color:#fff;font-size:11px;font-weight:800;line-height:1;vertical-align:middle;
}
.add-o{
  margin:12px 0 0;align-self:flex-start;background:var(--surf);border:1px solid var(--accent);color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:0 16px;min-height:40px;cursor:pointer;
}
.add-o:hover{background:var(--bg2)}
.add-o.on{background:var(--accent);color:#fff}

/* ---------- buttons, forms, modal ---------- */
.primary{background:var(--accent);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:14px;padding:0 20px;min-height:44px;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.ghost2{background:var(--surf);color:var(--fg);border:1px solid var(--ln2);border-radius:999px;font:inherit;font-size:14px;padding:0 18px;min-height:44px;cursor:pointer}
.ghost2:hover{background:var(--bg2)}
.oc-row{display:flex;gap:10px;align-items:center;max-width:720px}
.oc-box{position:relative;flex:1}
.oc-box.wide{max-width:520px;margin-bottom:14px}
.oc-box input{width:100%;box-sizing:border-box;background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:999px;padding:0 18px;font:inherit;font-size:14px;min-height:46px}
.oc-box input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.ol input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.oc-sel{margin:12px 0 0;font-size:13px;color:var(--mut)}
.chip-sel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);border-radius:999px;padding:4px 6px 4px 12px;color:var(--fg);font-size:13px}
.chip-sel button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;min-width:28px;min-height:28px}
.tbl-w{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--radius);background:var(--surf)}
.ol{width:100%;border-collapse:collapse;font-size:13.5px}
.ol th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.ol td{padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
.ol tr:last-child td{border-bottom:0}
.ol .sn{font-weight:600;min-width:140px}.ol .sn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.ol input.num{width:84px;box-sizing:border-box;background:var(--bg);border:1px solid var(--ln);color:var(--fg);border-radius:8px;padding:0 8px;font:inherit;min-height:38px;text-align:right}
.ol .lt{white-space:nowrap;font-weight:600;text-align:right}
.rm{background:none;border:0;color:var(--mut);cursor:pointer;min-width:36px;min-height:36px;font-size:14px}
.rm:hover{color:#d92d20}
.ol-t{text-align:right;margin:12px 4px 0;font-size:15px}
.form-g{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;min-height:44px}
.fld textarea{padding:10px 12px}
.act-bar{
  position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  margin-top:22px;padding:12px 14px;background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);box-shadow:var(--shadow);
}
.act-g{display:flex;flex-wrap:wrap;gap:8px}
.act-bar button:not(.primary){background:var(--bg);color:var(--fg);border:1px solid var(--ln2);border-radius:999px;font:inherit;font-size:14px;padding:0 16px;min-height:44px;cursor:pointer}
.act-bar button:not(.primary):hover{background:var(--bg2)}
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surf);color:var(--fg);border:1px solid var(--ln);border-radius:var(--radius);padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.modal input,.modal textarea{background:var(--bg);border:1px solid var(--ln);color:var(--fg);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;min-height:42px}
.modal textarea{padding:10px 12px}
.modal-act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.modal-err{color:#d92d20;font-size:13px;margin:0;min-height:1em}
.modal-note{font-size:11.5px;color:var(--mut);margin:0}
.pw-flash{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:400;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px}

/* ---------- my orders ---------- */
.dt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dt input{background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:999px;padding:0 12px;font:inherit;font-size:13px;min-height:44px}
.ins-h{margin:4px 0 8px;font-size:12px;font-weight:700;color:var(--fg2)}
.sp-apps.big{margin:0 0 16px}
.sp-apps.big button{font:inherit;font-size:13px;border:1px solid var(--ln2);background:var(--surf);color:var(--fg);border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer}
.sp-apps.big button:hover{border-color:var(--accent)}
.ord-g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ord{background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.ord-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord-c{margin:4px 0 8px;color:var(--mut);font-size:12.5px}
.ord ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.ord-t{margin:10px 0 0;font-weight:700;text-align:right}
.st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--ln2);border-radius:999px;padding:2px 9px;color:var(--fg2)}
.st-open{border-color:var(--accent);color:var(--ink)}
.st-transit{background:var(--accent);border-color:var(--accent);color:#fff}
.st-quote{border-style:dashed}
.st-delivered{color:var(--mut)}

/* ---------- print: only the quote ---------- */
#qprint{display:none}
@media print{
  body > *:not(#qprint):not(#sprint){display:none !important}
  #qprint{display:block;color:#000;background:#fff;padding:20px;font-family:Mulish,Arial,sans-serif}
  #qprint table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:12px}
  #qprint th,#qprint td{border:1px solid #999;padding:5px 7px;text-align:left}
  #qprint .qm th{width:28%;background:#eee}
}

.st-approved{border-color:var(--accent);color:var(--ink)}
.st-partial{background:var(--bg2);border-color:var(--accent);color:var(--fg)}
.st-completed{background:var(--bg2);color:var(--mut)}
.st-submitted{border-style:dashed;color:var(--fg)}
.st-draft{background:transparent;border-style:dotted;color:var(--mut)}

/* ---------- calendar ---------- */
.cal-t{min-width:150px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--radius);overflow:hidden}
.cal-wd{background:var(--bg2);padding:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}

tep\"><span class=\"n\">1<\/span><span class=\"lg\">Deal<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f c2\" data-f>\n          <label for=\"date\">Date <span class=\"req\">*<\/span><\/label>\n          <input id=\"date\" name=\"date\" type=\"date\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" data-f>\n          <label for=\"salesrep\">Sales responsible <span class=\"req\">*<\/span><\/label>\n          <select id=\"salesrep\" name=\"salesrep\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" data-f>\n          <label for=\"supplier\">Supplier <span class=\"req\">*<\/span><\/label>\n          <select id=\"supplier\" name=\"supplier\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\">\n          <label for=\"contractno\">Contract no.<\/label>\n          <input id=\"contractno\" name=\"contractno\" class=\"num\" placeholder=\"e.g. 26046\" autocomplete=\"off\">\n          <p class=\"help\">Leave empty if not assigned yet.<\/p>\n        <\/div>\n        <div class=\"f c4\">\n          <label for=\"custpo\">Customer order / PO reference<\/label>\n          <input id=\"custpo\" name=\"custpo\" autocomplete=\"off\">\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <!-- 2 \u00b7 customer -->\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">2<\/span><span class=\"lg\">Customer<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f c4\" data-f>\n          <label for=\"customer\">Customer name <span class=\"req\">*<\/span><\/label>\n          <input id=\"customer\" name=\"customer\" list=\"dl-cust\" required autocomplete=\"off\" autocapitalize=\"words\"><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\">\n          <span class=\"lab\">New customer?<\/span>\n          <div class=\"toggle\"><button type=\"button\" data-tog=\"newcust\" aria-pressed=\"false\">No<\/button><\/div>\n        <\/div>\n        <div class=\"f wide\" id=\"w-custaddr\" hidden data-f>\n          <label for=\"custaddr\">Address <span class=\"req\">*<\/span><\/label>\n          <input id=\"custaddr\" name=\"custaddr\" required>\n          <p class=\"help\">New customers also need the \u201cRequest a new customer\u201d form.<\/p>\n          <p class=\"err\">Required for a new customer.<\/p>\n        <\/div>\n        <div class=\"f c2\" id=\"w-custvat\" hidden data-f>\n          <label for=\"custvat\">VAT number <span class=\"req\">*<\/span><\/label>\n          <input id=\"custvat\" name=\"custvat\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" id=\"w-custcontact\" hidden>\n          <label for=\"custcontact\">Contact person<\/label>\n          <input id=\"custcontact\" name=\"custcontact\">\n        <\/div>\n        <div class=\"f c2\" id=\"w-custemail\" hidden>\n          <label for=\"custemail\">E-mail<\/label>\n          <input id=\"custemail\" name=\"custemail\" type=\"email\">\n        <\/div>\n        <div class=\"f c2\">\n          <span class=\"lab\">Agent involved?<\/span>\n          <div class=\"toggle\"><button type=\"button\" data-tog=\"agent\" aria-pressed=\"false\">No<\/button><\/div>\n        <\/div>\n        <div class=\"f c2\" id=\"w-agentname\" hidden data-f>\n          <label for=\"agentname\">Agent name / contact <span class=\"req\">*<\/span><\/label>\n          <input id=\"agentname\" name=\"agentname\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" id=\"w-agentcomm\" hidden data-f>\n          <label for=\"agentcomm\">Commission % <span class=\"req\">*<\/span><\/label>\n          <input id=\"agentcomm\" name=\"agentcomm\" class=\"num\" inputmode=\"decimal\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <!-- 3 \u00b7 products -->\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">3<\/span><span class=\"lg\">Products<\/span><\/div>\n      <div class=\"lines\" id=\"lines\"><\/div>\n      <button type=\"button\" class=\"addline\" id=\"addline\">+ Add product line<\/button>\n      <div class=\"totals\" aria-live=\"polite\">\n        <div><span>Total volume<\/span><b id=\"t-m3\">0 m\u00b3<\/b><\/div>\n        <div><span>Sales value<\/span><b id=\"t-sales\">\u2014<\/b><\/div>\n        <div><span>FOB value<\/span><b id=\"t-fob\">\u2014<\/b><\/div>\n        <div><span>Average FOB / m\u00b3<\/span><b id=\"t-avg\">\u2014<\/b><\/div>\n      <\/div>\n    <\/fieldset>\n\n    <!-- 4 \u00b7 price and terms -->\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">4<\/span><span class=\"lg\">Price and payment<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f c1 half\" data-f>\n          <label for=\"currency\">Currency <span class=\"req\">*<\/span><\/label>\n          <select id=\"currency\" name=\"currency\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c1 half\" data-f>\n          <label for=\"incoterm\">Incoterm <span class=\"req\">*<\/span><\/label>\n          <select id=\"incoterm\" name=\"incoterm\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" data-f>\n          <label for=\"incoplace_sel\">Named port / place <span class=\"req\">*<\/span><\/label>\n          <select id=\"incoplace_sel\" data-other=\"incoplace\" required aria-label=\"Named port or place\"><\/select>\n          <input id=\"incoplace\" name=\"incoplace\" required hidden autocomplete=\"off\" placeholder=\"Port or place\">\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" id=\"w-freight\" data-f>\n          <label for=\"freight\">Freight per m\u00b3 <span class=\"req\">*<\/span><\/label>\n          <input id=\"freight\" name=\"freight\" class=\"num\" inputmode=\"decimal\" required>\n          <p class=\"help\">Deducted from the unit price to get the FOB value.<\/p>\n          <p class=\"err\">Required for this Incoterm. Enter 0 if none.<\/p>\n        <\/div>\n        <div class=\"f c4\" data-f>\n          <label for=\"payment\">Payment terms <span class=\"req\">*<\/span><\/label>\n          <select id=\"payment\" name=\"payment\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\">\n          <span class=\"lab\">FSC certified<\/span>\n          <div class=\"toggle\"><button type=\"button\" data-tog=\"fsc\" aria-pressed=\"true\">Yes<\/button><\/div>\n        <\/div>\n        <div class=\"f wide\" id=\"w-paydetail\" hidden data-f>\n          <label for=\"paydetail\">Payment details <span class=\"req\">*<\/span><\/label>\n          <input id=\"paydetail\" name=\"paydetail\" required\n            placeholder=\"e.g. 30% advance payment, balance payable at 45 days end of month\">\n          <p class=\"err\">Describe the agreed terms.<\/p>\n        <\/div>\n        <div class=\"f wide\" id=\"w-approval\" hidden data-f>\n          <div class=\"warn\">\n            <b>Needs approval first<\/b>\n            <label class=\"check\"><input type=\"checkbox\" id=\"approved\" name=\"approved\" required>\n              <span>Discussed and approved with the CCO and the Manager Trading.<\/span><\/label>\n          <\/div>\n          <p class=\"err\">Letter of credit and deferred payment need approval before the contract is sent.<\/p>\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <!-- 5 \u00b7 shipment -->\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">5<\/span><span class=\"lg\">Production and shipment<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f c2\" data-f>\n          <label for=\"loading\">Loading <span class=\"req\">*<\/span><\/label>\n          <select id=\"loading\" name=\"loading\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2 half\" id=\"w-loadqty\" data-f>\n          <label for=\"loadqty\">Quantity <span class=\"req\">*<\/span><\/label>\n          <div class=\"stepper\"><button type=\"button\" data-step=\"-1\" aria-label=\"One less\">\u2212<\/button>\n            <input id=\"loadqty\" name=\"loadqty\" class=\"num\" inputmode=\"numeric\" value=\"1\" required>\n            <button type=\"button\" data-step=\"1\" aria-label=\"One more\">+<\/button><\/div>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2\" data-f>\n          <label for=\"destination_sel\">Destination <span class=\"req\">*<\/span><\/label>\n          <select id=\"destination_sel\" data-other=\"destination\" required aria-label=\"Destination\"><\/select>\n          <input id=\"destination\" name=\"destination\" required hidden autocomplete=\"off\" placeholder=\"Destination\">\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <label for=\"production\">Production period<\/label>\n          <input id=\"production\" name=\"production\" placeholder=\"e.g. Q3/Q4-2026\" autocomplete=\"off\">\n          <div class=\"chips\" id=\"ch-production\"><\/div>\n        <\/div>\n        <div class=\"f\">\n          <label for=\"shipment\">Shipment period<\/label>\n          <input id=\"shipment\" name=\"shipment\" placeholder=\"e.g. following production, approx. Q1-2027\" autocomplete=\"off\">\n          <div class=\"chips\" id=\"ch-shipment\"><\/div>\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <!-- 6 \u00b7 specifications -->\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">6<\/span><span class=\"lg\">Specifications and remarks<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f wide\">\n          <label for=\"lengthspec\">Length specification<\/label>\n          <textarea id=\"lengthspec\" name=\"lengthspec\" rows=\"2\"\n            placeholder=\"e.g. 2150 mm and longer, interval 300 mm, fair spread\"><\/textarea>\n          <div class=\"chips\" id=\"ch-lengthspec\"><\/div>\n        <\/div>\n        <div class=\"f wide\">\n          <label for=\"widthspec\">Width specification<\/label>\n          <textarea id=\"widthspec\" name=\"widthspec\" rows=\"1\"\n            placeholder=\"e.g. the 25x75 and 100 mm are recovery sizes\"><\/textarea>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"marking\">Marking <span class=\"req\">*<\/span><\/label>\n          <select id=\"marking\" name=\"marking\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <span class=\"lab\">Ends treated with anchorseal<\/span>\n          <div class=\"toggle\"><button type=\"button\" data-tog=\"anchorseal\" aria-pressed=\"true\">Yes<\/button><\/div>\n        <\/div>\n        <div class=\"f wide\" id=\"w-markingnote\" hidden data-f>\n          <label for=\"markingnote\">Marking instructions <span class=\"req\">*<\/span><\/label>\n          <input id=\"markingnote\" name=\"markingnote\" required placeholder=\"e.g. according to \u201carr\u00eat\u00e9 36\u201d, article 6\">\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f c2 half\">\n          <label for=\"stickmm\">Stickers, thickness (mm)<\/label>\n          <select id=\"stickmm\" name=\"stickmm\"><\/select>\n        <\/div>\n        <div class=\"f c2 half\">\n          <label for=\"stickevery\">Stickers, placed<\/label>\n          <select id=\"stickevery\" name=\"stickevery\"><\/select>\n        <\/div>\n        <div class=\"f c2 half\">\n          <label for=\"stickint\">Stickers, interval (cm)<\/label>\n          <select id=\"stickint\" name=\"stickint\"><\/select>\n        <\/div>\n        <div class=\"f wide\">\n          <label for=\"notes\">Special notes and remarks<\/label>\n          <textarea id=\"notes\" name=\"notes\" rows=\"3\"><\/textarea>\n          <div clas t here, or load them into `options`) ---------- */\nconst DEFAULTS={\n  /* species: value = siglas, label = trade name, extra.botanical */\n  species:[\n    {value:\"ABUI\",label:\"Abiuarana\",extra:{botanical:\"Chrysophyllum prieurii\",origin:\"PWA\"}},\n    {value:\"ACAR\",label:\"Acariquara\",extra:{botanical:\"Minquartia guianensis\",origin:\"PWA\"}},\n    {value:\"AMAP\",label:\"Amapa\",extra:{botanical:\"Brosimum parinarioides\",origin:\"PWA\"}},\n    {value:\"AMDO\",label:\"Amapa doce\",extra:{botanical:\"Brosimum potabile\",origin:\"PWA\"}},\n    {value:\"ANCA\",label:\"Angelim do campo\",extra:{botanical:\"Aldina heterophylla\",origin:\"PWA\"}},\n    {value:\"ANFA\",label:\"Angelim fava\",extra:{botanical:\"Parkia pendula\",origin:\"PWA\"}},\n    {value:\"ANPE\",label:\"Angelim pedra\",extra:{botanical:\"Hymenolobium modestum\",origin:\"PWA\"}},\n    {value:\"ANRA\",label:\"Angelim rajado\",extra:{botanical:\"Zygia racemosa\",origin:\"PWA\"}},\n    {value:\"ANVE\",label:\"Angelim vermelho\",extra:{botanical:\"Dinizia excelsa\",origin:\"PWA\"}},\n    {value:\"ARVE\",label:\"Arura vermelho\",extra:{botanical:\"Iryanthera paraensis\",origin:\"PWA\"}},\n    {value:\"BRBR\",label:\"Breu branco\",extra:{botanical:\"Protium paniculatum\",origin:\"PWA\"}},\n    {value:\"BRVE\",label:\"Breu vermelho\",extra:{botanical:\"Protium puncticulatum\",origin:\"PWA\"}},\n    {value:\"CAJU\",label:\"Caju\",extra:{botanical:\"Anacardium parvifolium\",origin:\"PWA\"}},\n    {value:\"CASA\",label:\"Castanha sapucaia\",extra:{botanical:\"Lecythis pisonis\",origin:\"PWA\"}},\n    {value:\"CAST\",label:\"Castanharana\",extra:{botanical:\"Lecythis prancei\",origin:\"PWA\"}},\n    {value:\"CDRI\",label:\"Cedrinho\",extra:{botanical:\"Scleronema micranthum\",origin:\"PWA\"}},\n    {value:\"CUMA\",label:\"Cumaru\",extra:{botanical:\"Dipteryx odorata\",origin:\"PWA\"}},\n    {value:\"CUVE\",label:\"Cumaru vermelho\",extra:{botanical:\"Dipteryx polyphylla\",origin:\"PWA\"}},\n    {value: label:\"Pequia marfim\",extra:{botanical:\"Aspidosperma desmanthum\",origin:\"PWA\"}},\n    {value:\"PARA\",label:\"Pequiarana\",extra:{botanical:\"Caryocar glabrum\",origin:\"PWA\"}},\n    {value:\"SUAM\",label:\"Sucupira amarela\",extra:{botanical:\"Enterolobium schomburgkii\",origin:\"PWA\"}},\n    {value:\"SUPR\",label:\"Sucupira preta\",extra:{botanical:\"Diplotropis racemosa\",origin:\"PWA\"}},\n    {value:\"SUVE\",label:\"Sucupira vermelha\",extra:{botanical:\"Andira parviflora\",origin:\"PWA\"}},\n    {value:\"TANI\",label:\"Tanibuca\",extra:{botanical:\"Buchenavia viridiflora\",origin:\"PWA\"}},\n    {value:\"TAUB\",label:\"Tauari branco\",extra:{botanical:\"Couratari guianensis\",origin:\"PWA\"}},\n    {value:\"TAUC\",label:\"Tauari cachimbo\",extra:{botanical:\"Allantoma decandra\",origin:\"PWA\"}},\n    {value:\"TAUV\",label:\"Tauari vermelho\",extra:{botanical:\"Cariniana micrantha\",origin:\"PWA\"}},\n    {value:\"TAXV\",label:\"Taxi vermelho\",extra:{botanical:\"Tachigali melanocarpum\",origin:\"PWA\"}},\n    {value:\"TIMB\",label:\"Timborana\",extra:{botanical:\"Pseudopiptadenia suaveolens\",origin:\"PWA\"}},\n    {value:\"UCHT\",label:\"Uchi torrado\",extra:{botanical:\"Vantanea parviflora\",origin:\"PWA\"}},\n    {value:\"VIOL\",label:\"Violeta\",extra:{botanical:\"Peltogyne catingae\",origin:\"PWA\"}},\n    {value:\"AZOB\",label:\"Azob\u00e9\",extra:{botanical:\"Lophira alata\",origin:\"PWG\"}},\n    {value:\"BELI\",label:\"Beli\",extra:{botanical:\"Julbernardia pellegriniana\",origin:\"PWG\"}},\n    {value:\"BILI\",label:\"Bilinga\",extra:{botanical:\"Nauclea diderrichii, N. Gilletii, N. Xanthoxylon\",origin:\"PWG\"}},\n    {value:\"DABE\",label:\"Dabema\",extra:{botanical:\"Piptadeniastrum africanum\",origin:\"PWG\"}},\n    {value:\"DIAN\",label:\"Diania\",extra:{botanical:\"Celtis adolfi-friderici, C. tessmannii\",origin:\"PWG\"}},\n    {value:\"DIBE\",label:\"Dibetou\",extra:{botanical:\"Lovoa swynnertonii, L. trichilioides\",origin:\"PWG\"}},\n    {value:\"EBIA\",label:\"Ebiara\",extra:{botanical:\"Berlinia bracteosa, B. confusa, B. grandiflora\",origin:\"PWG\"}},\n    {value:\"EVEU\",label:\"Eveuss\",extra:{botanical:\"Klainedoxa gabonensis, K. trillesii\",origin:\"PWG\"}},\n    {value:\"GOMB\",label:\"Gombe\",extra:{botanical:\"Didelotia africana, D. letouzeyi / Didelotia brevipaniculata, D. pauli-sitai\",origin:\"PWG\"}},\n    {value:\"ILOM\",label:\"Ilomba\",extra:{botanical:\"Pycnanthus angolensis\",origin:\"PWG\"}},\n    {value:\"IROK\",label:\"Iroko\",extra:{botanical:\"Milicia excelsa, M. regia\",origin:\"PWG\"}},\n    {value:\"IZOM\",label:\"Izombe\",extra:{botanical:\"Testulea gabonensis\",origin:\"PWG\"}},\n    {value:\"LIMB\",label:\"Limbali\",extra:{botanical:\"Gilbertiodendron dewevrei, G. preussii, G. splendidum\",origin:\"PWG\"}},\n    {value:\"MOVI\",label:\"Movingui\",extra:{botanical:\"Distemonanthus benthamianus\",origin:\"PWG\"}},\n    {value:\"NIOV\",label:\"Niove\",extra:{botanical:\"Staudtia kamerunensis\",origin:\"PWG\"}},\n    {value:\"OKAN\",label:\"Okan\",extra:{botanical:\"Cylicodiscus gabunensis\",origin:\"PWG\"}},\n    {value:\"OKOU\",label:\"Okoum\u00e9\",extra:{botanical:\"Aucoumea klaineana\",origin:\"PWG\"}},\n    {value:\"OMVO\",label:\"Omvong\",extra:{botanical:\"Dialium aubrevillei, D. bipidense, D. dinklagei, D. pachyphyllum\",origin:\"PWG\"}},\n    {value:\"OZIG\",label:\"Ozigo\",extra:{botanical:\"Dacryodes buettneri\",origin:\"PWG\"}},\n    {value:\"PADO\",label:\"Padouk rouge\",extra:{botanical:\"Pterocarpus osun, P. soyauxii\",origin:\"PWG\"}},\n    {value:\"SORR\",label:\"Sorro\",extra:{botanical:\"Scyphocephalium mannii\",origin:\"PWG\"}},\n    {value:\"TALI\",label:\"Tali\",extra:{botanical:\"Erythrophleum guineense, E. ivorense, E. suaveolens\",origin:\"PWG\"}}\n  ],\n  contract_salesrep:[\n    /*SALESREP*/\n  ],\n  contract_supplier:[\n    {value:'PWA',label:'PWA',extra:{origin:'PWA'}},{value:'PWG',label:'PWG',extra:{origin:'PWG'}},\n    {value:'CEB',label:'CEB',extra:{origin:'PWG'}}\n  ],\n  contract_drying:[\n    {value:'AD',label:'AD \u00b7 air dried'},{value:'KD',label:'KD \u00b7 kiln dried'}\n  ],\n  contract_grade:[\n    {value:'FAS',label:'FAS'},{value:'AIC',label:'AIC'},\n    {value:'Marine',label:'Marine'},{value:'Marine, Cat. 7',label:'Marine, Cat. 7'}\n  ],\n  currency:[{value:'EUR',label:'EUR'},{value:'USD',label:'USD'}],\n  contract_incoterm:[\n    {value:'FOB',label:'FOB',extra:{freight:false}},\n    {value:'CIF',label:'CIF',extra:{freight:true}},\n    {value:'CFR',label:'CFR',extra:{freight:true}}\n  ],\n  contract_port:[\n    {value:'Antwerp',label:'Antwerp'},{value:'Libreville',label:'Libreville'},\n    {value:'Mayotte',label:'Mayotte'},{value:'Rotterdam',label:'Rotterdam'}\n  ],\n  contract_payment:[\n    {value:'1st',label:'1st choice \u00b7 immediate payment against copies of documents by e-mail'},\n    {value:'2nd',label:'2nd choice \u00b7 against presentation of documents via bank (CAD)'},\n    {value:'3rd',label:'3rd choice \u00b7 letter of credit (approval needed)',extra:{approval:true,detail:true}},\n    {value:'Deferred',label:'Deferred payment (approval needed)',extra:{approval:true,detail:true}}\n  ],\n  contract_loading:[\n    {value:\"40'\",label:\"40' container\",extra:{qty:true}},\n    {value:\"20'\",label:\"20' container\",extra:{qty:true}},\n    {value:'Break bulk',label:'Break bulk',extra:{qty:false}}\n  ],\n  contract_marking:[\n    {value:'Only PW',label:'Only PW'},\n    {value:'As per customer PO',label:'As per customer PO'},\n    {value:'Other',label:'Other, specify',extra:{note:true}}\n  ],\n  contract_stick_mm:[{value:'7',label:'7'},{value:'10',label:'10'},{value:'15',label:'15'}],\n  contract_stick_every:[\n    {value:'every layer',label:'Every layer'},{value:'every 5th layer',label:'Every 5th layer'}\n  ],\n  contract_stick_int:[{value:'30',label:'30'},{value:'50',label:'50'}],\n  contract_finish:[{value:'V-pointed',label:'V-pointed'}],\n  /* one-click phrases */\n  contract_note:[\n    {value:'Marine quality: small defects, without influencing strength, are allowed. Sapwood allowed on bottom side of the pole, max. 1/3 of length.',label:'Marine quality clause'},\n    {value:'Order number to be mentioned on all communication: ',label:'Order number on all communication'},\n    {value:'Good quality required.',label:'Good quality required'}\n  ],\n  contract_length_note:[\n    {value:'Fair spread.',label:'Fair spread'},\n    {value:'Allowing max. 10% shorts, with 20% discount.',label:'Max. 10% shorts, 20% discount'},\n    {value:'See attached stock list.',label:'See stock list'}\n  ]\n};\nconst list=n=>(OPTS[n]&&OPTS[n].length?OPTS[n]:DEFAULTS[n])||[];\nconst opt=(n,v)=>list(n).find(o=>o.value===v);\nconst extra=(n,v)=>((opt(n,v)||{}).extra)||{};\n\n/* Articles: SIGLAS+1 = Sawn Timber, SIGLAS+2 = Industrialized */\nconst KINDS=[['1','Sawn Timber'],['2','Industrialized']];\nfunction articles(){\n  const out=[];\n  list('species').forEach(s=>KINDS.forEach(k=>out.push({\n    value:s.value+k[0], kind:k[0], species:s.label, origin:(s.extra||{}).origin||'Species',\n    label:s.value+k[0]+', '+s.label+' ('+((s.extra||{}).botanical||'\u2014')+'), '+k[1]\n  })));\n  return out;\n}\nconst article=v=>articles().find(a=>a.value===v);\n/* grouped by origin; the group of the chosen supplier comes first */\nfunction articleOptions(){\n  const pref=extra('contract_supplier',$('supplier').value).origin, g={};\n  articles().forEach(a=>{(g[a.origin]=g[a.origin]||[]).push(a)});\n  const keys=Object.keys(g).sort((a,b)=>(b===pref)-(a===pref)||a.localeCompare(b));\n  return '<option value=\"\">Select species and type\u2026<\/option>'+keys.map(k=>'<optgroup label=\"'+esc(k)+' species\">'\n    +g[k].map(o=>'<option value=\"'+esc(o.value)+'\">'+esc(o.label)+'<\/option>').join('')+'<\/optgroup>').join('');\n}\nfunction regroup(){\n  document.querySelectorAll('[data-k=\"article\"]').forEach(s=>{const v=s.value; s.innerHTML=articleOptions(); s.value=v});\n}\n\nfunction options(items,placeholder){\n  return '<option value=\"\">'+(placeholder||'Select\u2026')+'<\/option>'\n    +items.map(o=>'<option value=\"'+esc(o.value)+'\">'+esc(o.label)+'<\/option>').join('');\n}\nfunction fill(id,name,placeholder){ $(id).innerHTML=options(list(name),placeholder) }\n\n/* ---------- numbers ---------- */\nconst num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\\s/g,'').replace(',','.'));return isFinite(n)?n:0};\nconst fmt=(n,d)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d==null?2:d}).format(n);\n\n/* ---------- product lines ---------- */\nfunction lineHTML(){\n  return '<div class=\"lhead\"><span class=\"lno\"><\/span><span class=\"ldesc\"><\/span><span class=\"lval num\"><\/span>'\n   +'<button type=\"button\" class=\"mini\" data-dup>Duplicate<\/button>'\n   +'<button type=\"button\" class=\"mini\" data-del>Remove<\/button><\/div>'\n   +'<div class=\"fields\">'\n   +'<div class=\"f wide\" data-f><label>Article <span class=\"req\">*<\/span><\/label>'\n     +'<select data-k=\"article\" required>'+articleOptions()+'<\/select><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c2 half\" data-f><label>Drying <span class=\"req\">*<\/span><\/label>'\n     +'<select data-k=\"drying\" required>'+options(list('contract_drying'),'AD or KD\u2026')+'<\/select><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c2 half\" data-f><label>Quality / grade <span class=\"req\">*<\/span><\/label>'\n     +'<select data-k=\"grade\" required>'+options(list('contract_grade'))+'<\/select><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c2\"><label>Finish<\/label>'\n     +'<select data-k=\"finish\">'+options(list('contract_finish'),'None')+'<\/select><\/div>'\n   +'<div class=\"f c1 half\" data-f><label>Thickness mm <span class=\"req\">*<\/span><\/label>'\n     +'<input data-k=\"thickness\" class=\"num\" inputmode=\"decimal\" required autocomplete=\"off\"><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c1 half\" data-f><label>Width mm <span class=\"req\">*<\/span><\/label>'\n     +'<input data-k=\"width\" class=\"num\" inputmode=\"text\" required autocomplete=\"off\" placeholder=\"150 or 75/100\"><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c1 half\"><label>Length mm<\/label>'\n     +'<input data-k=\"length\" class=\"num\" autocomplete=\"off\" placeholder=\"3000\"><\/div>'\n   +'<div class=\"f c1 half\" data-f><label>Volume m\u00b3 <span class=\"req\">*<\/span><\/label>'\n     +'<input data-k=\"m3\" class=\"num\" inputmode=\"decimal\" required autocomplete=\"off\"><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c1 half\" data-f><label>Unit price / m\u00b3 <span class=\"req\">*<\/span><\/label>'\n     +'<input data-k=\"price\" class=\"num\" inputmode=\"decimal\" required autocomplete=\"off\"><p class=\"err\">Required.<\/p><\/div>'\n   +'<div class=\"f c1 half\"><label>Purchase price<\/label>'\n     +'<input data-k=\"pp\" class=\"num\" inputmode=\"decimal\" autocomplete=\"off\"><\/div>'\n   +'<div class=\"f wide\"><label>Line remark<\/label>'\n     +'<input data-k=\"remark\" autocomplete=\"off\" placeholder=\"e.g. MC abt. 18 to 20%\"><\/div>'\n   +'<\/div>';\n}\nfunction addLine(data,after){\n  const el=document.createElement('div'); el.className='line'; el.innerHTML=lineHTML();\n  if(after) after.after(el); else $('lines').appendChild(el);\n  if(data) Object.keys(data).forEach(k=>{const i=el.querySelector('[data-k=\"'+k+'\"]'); if(i) i.value=data[k]==null?'':data[k]});\n  return el;\n}\nfunction lineData(el){\n  const d={}; el.querySelectorAll('[data-k]').forEach(i=>{d[i.dataset.k]=i.value.trim()});\n  return d;\n}\n/* \"Sawn AD, V-pointed\" for sawn timber, \"ADI\" for industrialized */\nfunction describe(d){\n  const a=article(d.article); if(!a) return '';\n  let p=d.drying?(a.kind==='2'?d.drying+'I':'Sawn '+d.drying):(a.kind==='2'?'Industrialized':'Sawn');\n  if(d.finish) p+=', '+d.finish;\n  const size=[d.thickness,d.width,d.length].filter(Boolean).join(' x ');\n  return [a.species,p,d.grade,size?size+' mm':''].filter(Boolean).join(' \u00b7 ');\n}\n\n/* ---------- state ---------- */\nconst tog=k=>document.querySelector('[data-tog=\"'+k+'\"]');\nconst on=k=>tog(k).getAttribute('aria-pressed')==='true';\nfunction setTog(k,v){const b=tog(k); b.setAttribute('aria-pressed',String(!!v)); b.textContent=v?'Yes':'No'}\nfunction show(id,v){ $(id).hidden=!v }\n\nfunction freightApplies(){ const v=$('incoterm').value; return !!v && extra('contract_incoterm',v).freight!==false }\n\nfunction refresh(){\n  const nc=on('newcust'), ag=on('agent');\n  ['w-custaddr','w-custvat','w-custcontact','w-custemail'].forEach(i=>show(i,nc));\n  ['w-agentname','w-agentcomm'].forEach(i=>show(i,ag));\n  show('w-freight',freightApplies());\n  const px=extra('contract_payment',$('payment').value);\n  show('w-paydetail',!!px.detail); show('w-approval',!!px.approval);\n  show('w-loadqty',extra('contract_loading',$('loading').value).qty!==false);\n  show('w-markingnote',!!extra('contract_marking',$('marking').value).note);\n\n  const cur=$('currency').value||'', fr=freightApplies()?num($('freight').value):0;\n  let m3=0,sales=0,fob=0,priced=false;\n  [...$('lines').children].forEach((el,i)=>{\n    const d=lineData(el), v=num(d.m3), p=num(d.price);\n    el.querySelector('.lno').textContent='Line '+(i+1);\n    el.querySelector('.ldesc').textContent=describe(d);\n    el.querySelector('.lval').textContent=v&&p?cur+' '+fmt(v*p):'';\n    el.querySelector('[data-del]').hidden=$('lines').children.length<2;\n    m3+=v; sales+=v*p; fob+=v*(p-fr); if(v&&p) priced=true;\n  });\n  $('t-m3').textContent=fmt(m3,3)+' m\u00b3';\n  $('t-sales').textContent=priced?cur+' '+fmt(sales):'\u2014';\n  $('t-fob').textContent=priced?cur+' '+fmt(fob):'\u2014';\n  $('t-avg').textContent=priced&&m3?cur+' '+fmt(fob/m3):'\u2014';\n  const c=$('customer').value.trim();\n  $('sum').innerHTML=(c?'<b>'+esc(c)+'<\/b> \u00b7 ':'')+fmt(m3,3)+' m\u00b3'+(priced?' \u00b7 <b>'+esc(cur)+' '+fmt(sales)+'<\/b>':'');\n  const no=$('contractno').value.trim();\n  $('printref').textContent=[no?'Contract '+no:'',$('ref').textContent!=='\u2014'?'Ref. '+$('ref').textContent:'']\n    .filter(Boolean).join(' \u00b7 ');\n  document.querySelectorAll('textarea').forEach(grow);\n}\nfunction grow(a){ a.style.height='auto'; a.style.height=(a.scrollHeight+2)+'px' }\n\nfunction collect(){\n  const d={};\n  $('f').querySelectorAll('[name]').forEach(el=>{\n    if(el.type==='checkbox') d[el.name]=el.checked; else d[el.name]=el.value.trim();\n  });\n  ['newcust','agent','fsc','anchorseal','poattached'].forEach(k=>{d[k]=on(k)});\n  if(!d.newcust) ['custaddr','custvat','custcontact','custemail'].forEach(k=>delete d[k]);\n  if(!d.agent) ['agentname','agentcomm'].forEach(k=>delete d[k]);\n  if(!freightApplies()) d.freight='0';\n  if($('w-paydetail').hidden) delete d.paydetail;\n  if($('w-approval').hidden) delete d.approved;\n  if($('w-loadqty').hidden) delete d.loadqty;\n  if($('w-markingnote').hidden) delete d.markingnote;\n  const fr=num(d.freight);\n  d.lines=[...$('lines').children].map(el=>{\n    const l=lineData(el), a=article(l.article)||{};\n    l.species=a.species||''; l.article_label=a.label||'';\n    l.description=describe(l);\n    l.sales_value=+(num(l.m3)*num(l.price)).toFixed(2);\n    l.fob_value=+(num(l.m3)*(num(l.price)-fr)).toFixed(2);\n    return l;\n  });\n  d.total_m3=+d.lines.reduce((s,l)=>s+num(l.m3),0).toFixed(3);\n  d.total_sales=+d.lines.reduce((s,l)=>s+l.sales_value,0).toFixed(2);\n  d.total_fob=+d.lines.reduce((s,l)=>s+l.fob_value,0).toFixed(2);\n  return d;\n}\nfunction apply(d){\n  if(!d) return;\n  $('f').querySelectorAll('[name]').forEach(el=>{\n    if(!(el.name in d)) return;\n    if(el.type==='checkbox') el.checked=!!d[el.name]; else el.value=d[el.name];\n  });\n  ['newcust','agent','fsc','anchorseal','poattached'].forEach(k=>{ if(k in d) setTog(k,d[k]) });\n  if(Array.isArray(d.lines)&&d.lines.length){ $('lines').innerHTML=''; d.lines.forEach(l=>addLine(l)) }\n  setOther('incoplace_sel',$('incoplace').value); setOther('destination_sel',$('destination').value);\n  if(d.destination) $('destination_sel').dataset.own='1';\n}\nlet saveT=null;\nfunction saveDraft(){\n  clearTimeout(saveT);\n  saveT=setTimeout(saveNow,400);\n}\nfunction saveNow(){ clearTimeout(saveT); if(SENT||CLEARING) return; try{localStorage.setItem(DRAFT,JSON.stringify(collect()))}catch(e){} }\nfunction loadDraft(){ try{return JSON.parse(localStorage.getItem(DRAFT)||'null')}catch(e){return null} }\nfunction dropDraft(){ try{localStorage.removeItem(DRAFT)}catch(e){} }\n\n/* ---------- pick-or-type fields, recent customers ---------- */\nfunction syncOther(sel){\n  const inp=$(sel.dataset.other);\n  if(sel.value==='__other'){ inp.hidden=false; if([...sel.options].some(o=>o.value===inp.value)) inp.value=''; inp.focus() }\n  else { inp.hidden=true; inp.value=sel.value }\n}\nfunction setOther(selId,val){\n  const sel=$(selId), inp=$(sel.dataset.other); inp.value=val||'';\n  if(!val){ sel.value=''; inp.hidden=true }\n  else if([...sel.options].some(o=>o.value===val)){ sel.value=val; inp.hidden=true }\n  else { sel.value='__other'; inp.hidden=false }\n}\nfunction recent(){ try{return JSON.parse(localStorage.getItem(DRAFT+'-cust')||'[]')}catch(e){return []} }\nfunction remember(){\n  const c=$('customer').value.trim(); if(!c) return;\n  try{localStorage.setItem(DRAFT+'-cust',JSON.stringify([c].concat(recent().filter(x=>x!==c)).slice(0,30)))}catch(e){}\n}\n\n/* ---------- validation ---------- */\nfunction validate(){\n  let ok=true,first=null;\n  $('f').querySelectorAll('[data-f]').forEach(w=>{\n    if(w.hidden){w.classList.remove('bad');return}\n    let bad=false;\n    [...w.querySelectorAll('[required]')].filter(el=>!el.hidden).forEach(el=>{\n      const b=el.type==='checkbox'?!el.checked:!el.value.trim();\n      el.setAttribute('aria-invalid',String(b));\n      if(b){bad=true; if(!first) first=el}\n    });\n    w.classList.toggle('bad',bad); if(bad) ok=false;\n  });\n  if(first) first.focus();\n  say(ok?'':'Some required fields are still empty. They are marked in red.');\n  return ok;\n}\nfunction say(text,good){ const m=$('msg'); m.hidden=!text; m.textContent=text||''; m.classList.toggle('ok',!!good) }\n\n/* ---------- actions ---------- */\nasync function submit(e){\n  e.preventDefault();\n  if(!validate()) return;\n  if(STANDALONE){ say('Submit works from the portal. This offline copy cannot send: save the PDF, or save the data file and upload it in the portal later.'); return }\n  const b=$('send'); b.disabled=true; b.textContent='Sending\u2026';\n  const {data:row,error}=await PW.sb.from('form_submissions')\n    .insert({form:SLUG,space:DOC.space,section:DOC.section,data:collect()})\n    .select('ref').single();\n  if(error){ b.disabled=false; b.textContent='Submit contract'; say('Could not send the contract: '+error.message+'. Nothing was lost, try again.'); return }\n  SENT=true; dropDraft(); remember();\n  $('ref').textContent=row.ref||'\u2014';\n  b.textContent='Sent'; $('done').hidden=false; refresh();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction doPrint(){\n  if(!SENT && !validate()) say('Some required fields are still empty. The PDF will be incomplete.');\n  remember(); refresh(); window.print();\n}\nfunction saveJSON(){\n  remember();\n  const d=collect();\n  const name='contract-'+(d.contractno||d.date||'draft')+'-'+(d.customer||'customer').replace(/[^\\w-]+/g,'_').slice(0,40)+'.json';\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(new Blob([JSON.stringify({form:SLUG,version:1,data:d},null,2)],{type:'application/json'}));\n  a.download=name; document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(()=>URL.revokeObjectURL(a.href),2000);\n  say('Data file saved as '+name+'.',true);\n}\nfunction clearForm(){\n  const b=$('clear');\n  if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Clear everything?'; setTimeout(()=>{b.da

); fill('loading','contract_loading');\n  fill('marking','contract_marking');\n  fill('stickmm','contract_stick_mm','\u2014'); fill('stickevery','contract_stick_every','\u2014');\n  fill('stickint','contract_stick_int','\u2014');\n  ['incoplace_sel','destination_sel'].forEach(id=>{ $(id).innerHTML=options(list('contract_port'))+'<option value=\"__other\">Other\u2026<\/option>' });\n  $('dl-cust').innerHTML=recent().map(c=>'<option value=\"'+esc(c)+'\">').join('');\n  if(!STANDALONE && PW.email && $('salesrep').options.length<2){\n    $('salesrep').add(new Option(PW.email,PW.email)); $('salesrep').value=PW.email;\n  }\n  /* preview link without sign-in: nobody to pick, so do not ask */\n  if($('salesrep').options.length<2){ $('salesrep').required=false; $('salesrep').closest('.f').hidden=true }\n  chips('ch-notes','notes',list('contract_note'));\n  chips('ch-lengthspec','lengthspec',list('contract_length_note'));\n  chips('ch-production','production',quarters(),true);\n  chips('ch-shipment','shipment',[{value:'Following production',label:'Following production'}],true);\n\n  /* quick defaults: the usual answer is already selected */\n  const d=new Date(); $('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n  $('currency').value='EUR'; $('payment').value='1st'; $('loading').value=\"40'\"; $('marking').value='Only PW';\n  addLine();\n\n  const draft=loadDraft();\n  if(draft) apply(draft);\n  else { try{const s=JSON.parse(localStorage.getItem(DRAFT+'-me')||'{}'); if(s.salesrep) $('salesrep').value=s.salesrep; if(s.supplier) $('supplier').value=s.supplier}catch(e){} }\n\n  $('f').addEventListener('input',()=>{refresh();saveDraft()});\n  $('f').addEventListener('change',e=>{\n    if(e.target.id==='supplier') regroup();\n    if(e.target.id==='salesrep'||e.target.id==='supplier'){\n      try{localStorage.setItem(DRAFT+'-me',JSON.stringify({salesrep:$('salesrep').value,supplier:$('supplier').value}))}catch(x){}\n    }\n    /* destination follows the named port until it is typed by hand */\n    if(e.target.dataset.other) syncOther(e.target);\n    if(/^incoplace/.test(e.target.id) && freightApplies() && !$('destination_sel').dataset.own) setOther('destination_sel',$('incoplace').value);\n    if(/^destination/.test(e.target.id)) $('destination_sel').dataset.own='1';\n    refresh(); saveDraft();\n  });\n  $('f').addEventListener('click',e=>{\n    const b=e.target.closest('button'); if(!b) return;\n    if(b.dataset.tog){ setTog(b.dataset.tog,!on(b.dataset.tog)) }\n    else if(b.dataset.step){ const i=b.parentNode.querySelector('input'); i.value=Math.max(1,(parseInt(i.value,10)||0)+ +b.dataset.step) }\n    else if(b.classList.contains('chip')){ chipClick(b); return }\n    else if('dup' in b.dataset){ const src=b.closest('.line'); const n=addLine(lineData(src),src); n.querySelector('[data-k=\"thickness\"]').focus() }\n    else if('del' in b.dataset){ b.closest('.line').remove() }\n    else return;\n    refresh(); saveDraft();\n  });\n  $('addline').onclick=()=>{\n    const last=$('lines').lastElementChild, p=last?lineData(last):{};\n    const n=addLine({article:p.article,drying:p.drying,grade:p.grade,finish:p.finish});\n    n.querySelector('[data-k=\"'+(p.article?'thickness':'article')+'\"]').focus(); refresh(); saveDraft();\n  };\n  document.querySelectorAll('[data-act=\"print\"]').forEach(b=>b.onclick=doPrint);\n  document.querySelectorAll('[data-act=\"json\"]').forEach(b=>b.onclick=saveJSON);\n  $('clear').onclick=clearForm;\n  $('again').onclick=()=>{CLEARING=true;dropDraft();location.reload()};\n  $('f').addEventListener('submit',submit);\n  window.addEventListener('beforeprint',refresh);\n  /* phones close tabs without warning: keep the draft when the page is hidden */\n  window.addEventListener('pagehide',saveNow);\n  document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveNow() });\n\n  regroup();\n  route();\n  $('note').textContent=STANDALONE\n    ?'Offline copy: Submit only works from the portal. Fill it in, then Print / Save as PDF. Save the data file too if you want to upload the contract in the portal later without retyping.'\n    :'Submit stores the contract in the portal and sends it on. Print / Save as PDF gives the copy for the file.';\n  refresh();\n}\n\n(async()=>{\n  if(STANDALONE){ ungate(); build(); $('main').hidden=false; refresh(); return }\n  $('gatemsg').textContent=t('checking');\n  const c=await PW.connect();\n  if(!c.ok){\n    gate(gateShell('<h2>'+esc(t('offlineT'))+'<\/h2><p>'+esc(t('offlineB'))+'<\/p>'\n      +'<button onclick=\"location.reload()\">'+esc(t('retry'))+'<\/button>'));\n    return;\n  }\n  if(!c.session){ loginScreen(); return }\n  await PW.loadPrefs();\n  const [d,o,fc]=await Promise.all([\n    PW.sb.from('docs').select('slug,space,section,title').eq('slug',SLUG).maybeSingle(),\n    PW.sb.from('options').select('list,value,label,sort,extra').order('sort'),\n    PW.sb.from('form_config').select('*').eq('form',SLUG).maybeSingle()\n  ]);\n  if(!d.data){\n    gate(gateShell('<h2>'+esc(t('noAccessT'))+'<\/h2><p>'+esc(t('noAccessB',PW.email))+'<\/p>'\n      +'<p>'+esc(t('noAccessH'))+'<\/p>'));\n    return;\n  }\n  DOC=d.data; CFG=fc.data||null;\n  (o.data||[]).forEach(r=>{(OPTS[r.list]=OPTS[r.list]||[]).push(r)});\n  $('av').textContent=initials(PW.email);\n  ungate(); build(); $('main').hidden=false; refresh();\n  $('userbtn').onclick=()=>{location.href='../index.html'};\n})();\n<\/script>\n<\/body><\/html>\n", "customerform": "<!doctype html>\n<html lang=\"en\" data-theme=\"auto\" class=\"embed\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#121513\">\n<title>Request a new customer \u00b7 Precious Woods<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Tinos:wght@400;700&display=swap\">\n<style>\n/* ============================================================\n   Precious Woods \u00b7 Operations portal \u2014 shared styling\n   Forest greens, warm neutrals, a quiet serif for headings.\n   ============================================================ */\n\n:root{\n  --accent:#00A65C;\n  --radius:10px;\n  --maxw:1060px;\n  --serif:Mulish,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n  --sans:Mulish,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n}\n\n/* dark is the default; light only when asked for, or when the system says so */\n.brand{gap:9px}\n.brand .mk{height:24px;width:auto;display:block;flex:none}\n@media (max-width:640px){.brand .mk{height:21px}}\n\n:root,\n:root[data-theme=\"dark\"]{\n  --ink:#35C27E;\n  --bg:#121513;      --bg2:#171b18;\n  --surf:#1b201d;    --surf2:#222824;\n  --ln:#2b322d;      --ln2:#3a433d;\n  --fg:#e9ece9;      --fg2:#c3cac5;\n  --mut:#8d9a93;\n  --shadow:0 1px 2px rgba(0,0,0,.4);\n}\n:root[data-theme=\"light\"]{\n  --ink:#00743F;\n  --bg:#f6f5f2;      --bg2:#efeeea;\n  --surf:#ffffff;    --surf2:#faf9f7;\n  --ln:#e0ded8;      --ln2:#c9c6bd;\n  --fg:#1a1f1c;      --fg2:#39413b;\n  --mut:#5f6b64;\n  --shadow:0 1px 2px rgba(26,31,28,.07);\n}\n@media (prefers-color-scheme:light){\n  :root[data-theme=\"auto\"]{\n    --ink:#00743F;\n    --bg:#f6f5f2;    --bg2:#efeeea;\n    --surf:#ffffff;  --surf2:#faf9f7;\n    --ln:#e0ded8;    --ln2:#c9c6bd;\n    --fg:#1a1f1c;    --fg2:#39413b;\n    --mut:#5f6b64;\n    --shadow:0 1px 2px rgba(26,31,28,.07);\n  }\n}\n\n*{box-sizing:border-box}\nhtml{background:var(--bg);-webkit-text-size-adjust:100%}\nbody{\n  margin:0;background:var(--bg);color:var(--fg);\n  font:15px/1.6 var(--sans);\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n}\na{color:inherit}\n\n/* ---------- top bar ---------- */\n.bar{\n  position:sticky;top:0;z-index:41;background:var(--bg);\n  border-bottom:1px solid var(--ln);\n}\n.bar .in{\n  max-width:var(--maxw);margin:0 auto;padding:0 22px;\n  height:58px;display:flex;align-items:center;gap:16px;\n}\n.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;min-width:0}\n.brand .mark{\n  font-family:Tinos,Georgia,serif;font-size:16px;font-weight:700;\n  letter-spacing:.055em;text-transform:uppercase;\n  white-space:nowrap;\n}\n.brand .seg{\n  font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--mut);\n  white-space:nowrap;padding-left:10px;border-left:1px solid var(--ln);\n}\n.bar .sp{flex:1}\n\n\n/* ---------- page ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:30px 22px 80px}\n.lede{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 30px}\n.lede h1{font-family:var(--serif);font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;letter-spacing:-.01em}\n.lede .pill{\n  font-size:11px;color:var(--mut);border:1px solid var(--ln);border-radius:999px;padding:3px 10px;\n}\n\nsection.sec{margin:0 0 34px}\nsection.sec h2{\n  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);\n  margin:0 0 13px;font-weight:600;padding-bottom:9px;border-bottom:1px solid var(--ln);\n}\n.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}\n\n.card{\n  display:block;text-decoration:none;color:inherit;background:var(--surf);\n  border:1px solid var(--ln);border-radius:var(--radius);padding:15px 16px;\n  box-shadow:var(--shadow);transition:border-color .13s,transform .13s;\n}\na.card:hover{border-color:var(--ln2);transform:translateY(-1px)}\n.card .t{\n  font-size:14.5px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;\n  gap:8px;flex-wrap:wrap;line-height:1.35;\n}\n.card .d{font-size:13px;color:var(--fg2);margin:0;line-height:1.5}\n.card .m{font-size:11.5px;color:var(--mut);margin:11px 0 0}\n.card.empty{background:none;border-style:dashed;box-shadow:none}\n.card.empty .t{color:var(--fg2)}\n.tag{\n  font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;\n  border:1px solid var(--ln2);border-radius:999px;padding:2px 7px;color:var(--mut);\n}\n.none{\n  color:var(--mut);font-size:13px;border:1px dashed var(--ln);border-radius:var(--radius);\n  padding:17px;margin:0;\n}\n\n/* ---------- access screen ---------- */\n#gate{\n  position:fixed;inset:0;z-index:999;background:var(--bg);\n  display:flex;align-items:center;justify-content:center;padding:24px;\n}\n#gate .gcard{\n  max-width:400px;width:100%;background:var(--surf);border:1px solid var(--ln);\n  border-radius:14px;padding:30px 26px;text-align:center;box-shadow:var(--shadow);\n}\n#gate .gmark{\n  font-family:Tinos,Georgia,serif;font-size:17px;font-weight:700;\n  letter-spacing:.07em;text-transform:uppercase;margin:0 0 5px;\n}\n#gate .gseg{\n  font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--mut);margin:0 0 18px;\n}\n#gate h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 10px}\n#gate p{margin:0 0 15px;font-size:13.5px;color:var(--mut);line-height:1.55}\n#gate form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}\n#gate input[type=email]{\n  flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--ln);color:var(--fg);\n  border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;\n}\n#gate input[type=email]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}\n#gate button{\n  background:var(--accent);border:0;color:#fff;border-radius:8px;padding:10px 17px;\n  font:inherit;font-size:14px;font-weight:500;cursor:pointer;\n}\n#gate button:hover{filter:brightness(1.08)}\n#gate .gmsg{margin:15px 0 0;min-height:18px;font-size:12.5px;color:var(--mut)}\n#gate .glang{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--ln)}\n#gate .glang select{\n  background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;\n}\n\n@media (max-width:640px){\n  .bar .in{padding:0 14px;height:54px;gap:10px}\n  .navbar .in{padding:0 14px;height:42px}\n  .nav button{padding:0 12px;font-size:13px}\n  .mega{top:96px}\n  .brand .seg{display:none}\n  .page{padding:22px 14px 70px}\n  .lede h1{font-size:22px}\n  .grid{grid-template-columns:1fr}\n  .panel{right:10px;left:10px;width:auto;top:50px}\n}\n\n/* ---------- main navigation ---------- */\n/* segunda fila: la navegacion, a todo lo ancho */\n.navbar{border-top:1px solid var(--ln);background:var(--bg)}\n.navbar .in{\n  max-width:var(--maxw);margin:0 auto;padding:0 22px;height:44px;\n  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;\n  scrollbar-width:none;-webkit-overflow-scrolling:touch;\n}\n.navbar .in::-webkit-scrollbar{display:none}\n.nav{display:flex;align-items:stretch;gap:2px;height:100%}\n.nav button{\n  background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);\n  font:inherit;font-size:13.5px;padding:0 15px;cursor:pointer;display:flex;align-items:center;\n  gap:6px;white-space:nowrap;\n}\n.nav button:hover{color:var(--fg)}\n.nav button[aria-expanded=\"true\"]{color:var(--fg);border-bottom-color:var(--accent)}\n.nav button .caret{font-size:8px;opacity:.55;transform:translateY(1px)}\n\n.mega{\n  position:fixed;left:0;right:0;top:103px;z-index:45;display:none;\n  background:var(--surf);border-bottom:1px solid var(--ln);\n  box-shadow:0 16px 36px rgba(0,0,0,.26);\n}\n.mega.open{display:block}\n.mega .in{\n  max-width:var(--maxw);margin:0 auto;padding:22px 22px 24px;\n  display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));\n}\n.mega .col h5{\n  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--mut);\n  margin:0 0 9px;font-weight:600;padding-bottom:7px;border-bottom:1px solid var(--ln);\n}\n.mega .col a{\n  display:block;text-decoration:none;color:var(--fg2);font-size:13.5px;\n  padding:6px 8px;margin:0 -8px;border-radius:7px;line-height:1.4;\n}\n.mega .col a:hover{background:var(--surf2);color:var(--fg)}\n.mega .col a .sub{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}\n.mega .col .none{border:0;padding:5px 0;font-size:12.5px}\n.mega .col a.all{color:var(--ink);font-size:12px;margin-top:4px}\n\n/* search */\n.search{position:relative;display:flex;align-items:center}\n.search input{\n  background:var(--surf);border:1px solid var(--ln);color:var(--fg);border-radius:999px;\n  padding:7px 13px;font:inherit;font-size:13px;width:168px;transition:width .16s,border-color .16s;\n}\n.search input:focus{outline:none;border-color:var(--accent);width:230px}\n.search input::placeholder{color:var(--mut)}\n.results{\n  position:absolute;top:40px;right:0;width:330px;background:var(--surf);\n  border:1px solid var(--ln);border-radius:var(--radius);box-shadow:0 14px 34px rgba(0,0,0,.28);\n  padding:6px;display:none;max-height:60vh;overflow:auto;z-index:70;\n}\n.results.open{display:block}\n.results a{\n  display:block;text-decoration:none;color:var(--fg2);font-size:13px;padding:8px 10px;border-radius:7px;\n}\n.results a:hover{background:var(--surf2);color:var(--fg)}\n.results a .where{display:block;font-size:11px;color:var(--mut)}\n.results .none{border:0;padding:10px;font-size:12.5px}\n\n@media (max-width:900px){\n  .search input{width:130px}\n  .search input:focus{width:170px}\n}\n@media (max-width:640px){\n  .results{width:auto;left:-120px;right:-8px}\n}\n\n/* ---------- admin ---------- */\n.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:0 0 24px}\n.tabs button{\n  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);\n  font:inherit;font-size:13.5px;padding:9px 15px;cursor:pointer;margin-bottom:-1px;\n}\n.tabs button:hover{color:var(--fg)}\n.tabs button[aria-selected=\"true\"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}\n\n.split{display:grid;gap:22px;grid-template-columns:260px 1fr;align-items:st #d2766c;border-color:#5a3733}\n\ntable.rows{width:100%;border-collapse:collapse;font-size:13px}\ntable.rows th{\n  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);\n  font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--ln);\n}\ntable.rows td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:top}\ntable.rows tr:last-child td{border-bottom:0}\ntable.rows .ref{font-weight:600;white-space:nowrap}\n.state{\n  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;\n  border-radius:999px;padding:2px 8px;border:1px solid var(--ln2);color:var(--mut);white-space:nowrap;\n}\n.state.new{border-color:var(--accent);color:var(--accent)}\n.state.approved{border-color:#4f8a63;color:#5fa377}\n.state.rejected{border-color:#8a4f4f;color:#c0796f}\ndetails.det summary{cursor:pointer;font-size:12px;color:var(--accent);margin-top:6px}\ndetails.det pre{\n  background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:11px;\n  font-size:11.5px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;\n}\n.msg{font-size:12.5px;color:var(--mut);margin:12px 0 0;min-height:17px}\n\n@media (max-width:820px){ .split{grid-template-columns:1fr} }\n\n/* ============ dashboard ============ */\n.hero{\n  border-bottom:1px solid var(--ln);background:var(--bg2);\n  margin:0 0 30px;padding:30px 0 26px;\n}\n.hero .in{max-width:var(--maxw);margin:0 auto;padding:0 22px}\n.hero .co{\n  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);\n  font-weight:700;margin:0 0 7px;\n}\n.hero h1{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;letter-spacing:-.01em}\n.hero p.claim{color:var(--mut);font-size:14px;margin:0;max-width:56ch;line-height:1.55}\n.facts{display:flex;gap:26px;flex-wrap:wrap;margin:20px 0 0}\n.facts div{font-size:12px;color:var(--mut);line-height:1.3}\n.facts b{display:block;font-family:var(--serif);font-size:20px;color:var(--fg);font-weight:600}\n\n.layout{display:grid;gap:26px;grid-template-columns:1fr 288px;align-items:start}\n\n.quick{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 26px}\n.quick a{\n  display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg);\n  background:var(--surf);border:1px solid var(--ln);border-radius:999px;padding:8px 16px 8px 11px;\n  font-size:13px;font-weight:500;box-shadow:var(--shadow);\n}\n.quick a:hover{border-color:var(--accent)}\n.quick a .ic{\n  width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;flex:none;\n  display:grid;place-items:center;font-size:12px;font-weight:700;\n}\n\nh3.band{\n  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);\n  margin:0 0 13px;font-weight:600;\n}\n\n.mods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}\n.mod{\n  text-align:left;background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);\n  padding:16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);\n  transition:border-color .13s,transform .13s;display:flex;flex-direction:column;gap:5px;min-height:112px;\n}\n.mod:hover{border-color:var(--accent);transform:translateY(-1px)}\n.mod .top{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.mod .glyph{\n  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;\n  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);\n}\n.mod .n{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}\n.mod .nm{font-size:14.5px;font-weight:600;margin:6px 0 0}\n.mod .meta{font-size:11.5px;color:var(--mut);margin-top:auto}\n.mod .bar{height:2px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:9px}\n.mod .bar i{display:block;height:100%;background:var(--accent)}\n\n.side{display:flex;flex-direction:column;gap:22px;position:sticky;top:120px}\n.widget{background:var( max-width:980px){\n  .layout{grid-template-columns:1fr}\n  .side{position:static}\n}\n@media (max-width:640px){\n  .hero{padding:22px 0 20px;margin-bottom:22px}\n  .hero .in{padding:0 14px}\n  .hero h1{font-size:23px}\n  .facts{gap:18px}\n  .facts b{font-size:17px}\n  .mods{grid-template-columns:1fr 1fr}\n  .mod{min-height:98px;padding:13px}\n}\n\n.logo{height:26px;width:auto;display:block}\n@media (max-width:640px){ .logo{height:22px} }\n\n#gate .gmk{height:40px;width:auto;display:block;margin:0 auto 12px}\n/* ============================================================\n   Precious Woods portals \u2014 user button + settings panel.\n   Shared by every page; pw.css imports it, doc.html links it.\n   ============================================================ */\n\n.ghost{\n  background:none;border:1px solid transparent;color:var(--mut);\n  font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;\n  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;\n}\n.ghost:hover{color:var(--fg);background:var(--surf)}\n.ghost[aria-expanded=\"true\"]{color:var(--fg);background:var(--surf);border-color:var(--ln)}\n\n.av{\n  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;\n  display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none;\n}\n\n/* ---------- preferences panel ---------- */\n.panel{\n  position:absolute;right:22px;top:52px;z-index:60;width:286px;\n  background:var(--surf);border:1px solid var(--ln);border-radius:var(--radius);\n  box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px;display:none;\n}\n.panel.open{display:block}\n.panel .who{padding:11px 12px 12px;border-bottom:1px solid var(--ln);margin:0 0 6px}\n.panel .who b{display:block;font-size:13px;font-weight:600;word-break:break-all}\n.panel .who span{font-size:11.5px;color:var(--mut)}\n.panel h4{\n  font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--mut);\n  margin:12px 10px 7px;font-weight:600;\n}\n.panel .row{display:flex;gap:5px;padding:0 8px 4px;flex-wrap:wrap}\n.panel select{\n  width:calc(100% - 16px);margin:0 8px 4px;background:var(--surf2);color:var(--fg);\n  border:1px solid var(--ln);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;\n}\n.seg3{display:flex;gap:4px;padding:0 8px 4px;width:100%}\n.seg3 button{\n  flex:1;background:var(--surf2);border:1px solid var(--ln);color:var(--mut);\n  font:inherit;font-size:12px;padding:6px 4px;border-radius:7px;cursor:pointer;\n}\n.seg3 button[aria-pressed=\"true\"]{border-color:var(--accent);color:var(--fg);background:var(--bg2)}\n.swatches{display:flex;gap:7px;padding:2px 10px 8px;flex-wrap:wrap;align-items:center}\n.swatches button{\n  width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;\n}\n.swatches button[aria-pressed=\"true\"]{border-color:var(--fg)}\n.swatches input[type=color]{\n  width:22px;height:22px;padding:0;border:1px solid var(--ln);border-radius:50%;\n  background:none;cursor:pointer;\n}\n.panel .foot{border-top:1px solid var(--ln);margin:8px 0 0;padding:6px 4px 2px}\n.panel .foot button{\n  width:100%;text-align:left;background:none;border:0;color:var(--mut);\n  font:inherit;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer;\n}\n.panel .foot button:hover{background:var(--surf2);color:var(--fg)}\n\n/* portal switcher inside the panel */\n.panel .plist{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}\n.panel .plist a{\n  display:block;text-decoration:none;color:var(--fg2,var(--fg));font-size:13px;\n  padding:7px 10px;border-radius:7px;\n}\n.panel .plist a:hover{background:var(--surf2);color:var(--fg)}\n.panel .plist a[aria-current=\"page\"]{background:var(--bg2);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}\n\n.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 16px);margin:0 8px 4px;padding:0 12px;min-height:42px;background:var(--sur NgOMtMQSqZAYUHsvshU8VZm5YjwxxP8PysEdKA4mCI7BcRag1NEgfLTeI23PXgK8knoJLko/h9KvEZkKjnwUpV/BcR6kHPwRz38IEPEzqiXVpoLLKw8ba8h2K95C1/8PDQ/6v+OM0WEAAAAASUVORK5CYII=\" alt=\"\" width=\"24\" height=\"24\">\n    <span class=\"mark\">Precious Woods<\/span><span class=\"seg\">Operations<\/span>\n  <\/a>\n  <span class=\"sp\"><\/span>\n  <button class=\"ghost\" id=\"userbtn\"><span class=\"av\" id=\"av\">\u00b7\u00b7<\/span><\/button>\n<\/div><\/header>\n\n<main class=\"page form\" id=\"main\" hidden>\n  <a class=\"back\" href=\"../index.html\">\u2190 Forms<\/a>\n\n  <p class=\"kicker\" id=\"kicker\">PWEU \u00b7 Master data<\/p>\n  <h1>Request a new customer<\/h1>\n  <p class=\"intro\">Fill in only what is specific to this customer. Everything else is set up\n  the same way for every card. Fields marked\n  <span style=\"color:var(--accent)\">*<\/span> are required.<\/p>\n\n  <form id=\"f\" novalidate>\n\n    <fieldset hidden>\n      <div class=\"step\"><span class=\"n\">0<\/span><span class=\"lg\">Template customer<\/span><\/div>\n      <div class=\"box\">\n        <div class=\"fields\">\n          <div class=\"f wide\">\n            <select id=\"template\" name=\"template\"><\/select>\n            <p class=\"help\">Posting groups, location and shipment settings come from this customer.\n            Pick the template that matches the business segment.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/fieldset>\n\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">1<\/span><span class=\"lg\">Who is the customer?<\/span>\n        <span class=\"by\">Filled by Sales rep<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f wide\" data-f>\n          <label for=\"name\">Customer name <span class=\"req\">*<\/span><\/label>\n          <input id=\"name\" name=\"name\" required autocomplete=\"off\">\n          <p class=\"help\">Search Acadon first: the customer may already exist.<\/p>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f wide\" data-f>\n          <label for=\"address\">Address <span class=\"req\">*<\/span><\/label>\n          <input id=\"address\" name=\"address\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"postcode\">Post code <span class=\"req\">*<\/span><\/label>\n          <input id=\"postcode\" name=\"postcode\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"city\">City <span class=\"req\">*<\/span><\/label>\n          <input id=\"city\" name=\"city\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"country\">Country <span class=\"req\">*<\/span><\/label>\n          <select id=\"country\" name=\"country\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"vat\">VAT number <span class=\"req\">*<\/span><\/label>\n          <input id=\"vat\" name=\"vat\" required><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <label for=\"coc\">Chamber of Commerce no.<\/label>\n          <input id=\"coc\" name=\"coc\">\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">2<\/span><span class=\"lg\">Contact and documents<\/span>\n        <span class=\"by\">Filled by Sales rep<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f wide\" data-f>\n          <label for=\"email\">E-mail for documents <span class=\"req\">*<\/span><\/label>\n          <input id=\"email\" name=\"email\" type=\"email\" required>\n          <p class=\"help\">Contracts and invoices are sent here.<\/p>\n          <p class=\"err\">A valid e-mail address is required.<\/p>\n        <\/div>\n        <div class=\"f\"><label for=\"phone\">Phone<\/label><input id=\"phone\" name=\"phone\" type=\"tel\"><\/div>\n        <div class=\"f\" data-f>\n          <label for=\"doclang\">Language of documents <span class=\"req\">*<\/span><\/label>\n          <select id=\"doclang\" name=\"doclang\" required><\/select>\n          <p class=\"help\">Sets the contract and invoice layout.<\/p>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <label for=\"copies\">Invoice copies<\/label>\n          <input id=\"copies\" name=\"copies\" type=\"number\" min=\"0\" max=\"9\" value=\"1\">\n          <p class=\"help\">Standard value still to be agreed.<\/p>\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <fieldset>\n      <div class=\"step\"><span class=\"n\">3<\/span><span class=\"lg\">Commercial terms<\/span>\n        <span class=\"by\">Filled by Sales rep<\/span><\/div>\n      <div class=\"box\"><div class=\"fields\">\n        <div class=\"f\" data-f>\n          <label for=\"segment\">Business segment <span class=\"req\">*<\/span><\/label>\n          <select id=\"segment\" name=\"segment\" required><\/select>\n          <p class=\"help\">Drives the reporting. One segment per contract.<\/p>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"currency\">Invoice currency <span class=\"req\">*<\/span><\/label>\n          <select id=\"currency\" name=\"currency\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f wide\" data-f>\n          <label for=\"terms\">Standard payment terms <span class=\"req\">*<\/span><\/label>\n          <select id=\"terms\" name=\"terms\" required><\/select>\n          <p class=\"help\">Short standard list only. Any other term needs authorisation first.<\/p>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <label>Prepayment customer?<\/label>\n          <div class=\"toggle\">\n            <button type=\"button\" id=\"prepay\" aria-pressed=\"false\">No<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"f\" id=\"prepaywrap\" hidden data-f>\n          <label for=\"prepaypct\">Prepayment % <span class=\"req\">*<\/span><\/label>\n          <input id=\"prepaypct\" name=\"prepaypct\" type=\"number\" min=\"1\" max=\"100\" value=\"50\">\n          <p class=\"help\">Set here, not as a separate payment term, so the standard list stays short.<\/p>\n          <p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\" data-f>\n          <label for=\"shipment\">Shipment method (Incoterm + port) <span class=\"req\">*<\/span><\/label>\n          <select id=\"shipment\" name=\"shipment\" required><\/select><p class=\"err\">Required.<\/p>\n        <\/div>\n        <div class=\"f\">\n          <label for=\"shipto\">Default ship-to / port<\/label>\n          <input id=\"shipto\" name=\"shipto\">\n        <\/div>\n      <\/div><\/div>\n    <\/fieldset>\n\n    <fieldset id=\"inhset\">\n      <div class=\"step\"><span class=\"n\">4<\/span><span class=\"lg\">Copied from the template<\/span>\n        <span class=\"by\">Nothing to fill in<\/span><\/div>\n      <div class=\"box\">\n        <p class=\"help\" style=\"margin:0\">Accounting and shipping defaults are inherited, so they\n        cannot be mistyped. Accounting reviews them when the request is approved.<\/p>\n        <button type=\"button\" class=\"linkish\" id=\"togInh\" style=\"margin-top:10px\">Hide inherited fields<\/button>\n        <div class=\"inh\" id=\"inh\"><\/div>\n      <\/div>\n    <\/fieldset>\n\n    <div class=\"actions\">\n      <button type=\"submit\" class=\"primary\" id=\"send\">Submit request<\/button>\n      <p class=\"note\">Approval is sent from the Request Approval tab in Acadon once the card\n      exists. This form only makes sure nothing is missing.<\/p>\n    <\/div>\n  <\/form>\n\n  <div class=\"done\" id=\"done\" hidden>\n    <div class=\"tick\">\u2713<\/div>\n    <h2>Request sent<\/h2>\n    <p cl tAttribute('aria-label','Show options'); btn.innerHTML='<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg>';\n  const ul=document.createElement('ul'); ul.className='cbl'; ul.setAttribute('role','listbox'); ul.hidden=true;\n  el.parentNode.insertBefore(wrap,el); wrap.append(inp,btn,ul); wrap.appendChild(el);\n  el.hidden=true; el.removeAttribute('required');\n  let items=[], act=-1, typed=false;\n  const opts=()=>[...el.options].filter(o=>o.value&&!o.dataset.free);\n  const paint=()=>{\n    const q=typed?inp.value.trim().toLowerCase():'';\n    items=opts().filter(o=>!q||o.textContent.toLowerCase().includes(q));\n    if(q) items.sort((a,b)=>(b.textContent.toLowerCase().startsWith(q)-a.textContent.toLowerCase().startsWith(q)));\n    ul.innerHTML=items.length?items.map((o,i)=>'<li role=\"option\" data-i=\"'+i+'\"'+(o.value===el.value?' aria-selected=\"true\"':'')+'>'+esc(o.textContent)+'<\/li>').join(''):'<li class=\"cbn\">No match: the text you type will be used as entered.<\/li>';\n    act=items.length&&q?0:-1; mark();\n  };\n  const mark=()=>{ ul.querySelectorAll('li[data-i]').forEach((li,i)=>li.classList.toggle('act',i===act)); const a=ul.querySelector('li.act'); if(a) a.scrollIntoView({block:'nearest'}) };\n  const open=()=>{ paint(); ul.hidden=false; inp.setAttribute('aria-expanded','true') };\n  const close=()=>{ ul.hidden=true; inp.setAttribute('aria-expanded','false'); typed=false };\n  const sync=()=>{\n    const v=inp.value.trim();\n    const m=opts().find(o=>o.textContent.toLowerCase()===v.toLowerCase());\n    if(m){ el.value=m.value; inp.value=m.textContent }\n    else if(!v){ el.value='' }\n    else{\n      let o=[...el.options].find(x=>x.dataset.free==='1');\n      if(!o){ o=document.createElement('option'); o.dataset.free='1'; el.appendChild(o) }\n      o.value=v; o.textContent=v; el.value   });

  /* ---------- preferences ---------- */
  const DEF = { lang:'en', theme:'system', accent:'#00A65C', space:null, showPrice:true };
  let prefs = Object.assign({}, DEF);

  function readLocal(){
    try{
      const r = localStorage.getItem('pw-prefs');
      if(r) Object.assign(prefs, JSON.parse(r));
    }catch(e){}
    if(!T[prefs.lang]) prefs.lang = 'en';
  }
  function writeLocal(){
    try{ localStorage.setItem('pw-prefs', JSON.stringify(prefs)); }catch(e){}
  }

  function t(key, ...args){
    const dict = T[prefs.lang] || T.en;
    let s = dict[key] != null ? dict[key] : (T.en[key] != null ? T.en[key] : key);
    args.forEach((a,i)=>{ s = s.split('{'+i+'}').join(a); });
    return s;
  }

  /* ---------- theme ---------- */
  function applyTheme(){
    const r = document.documentElement;
    r.setAttribute('data-theme', prefs.theme === 'system' ? 'auto' : prefs.theme);
    r.style.setProperty('--accent', prefs.accent || DEF.accent);
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', resolved() === 'dark' ? '#121513' : '#f6f5f2');
  }
  function resolved(){
    if(prefs.theme === 'light' || prefs.theme === 'dark') return prefs.theme;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  /* ---------- connection ---------- */
  let sb = null, session = null;

  function addScript(src){
    return new Promise(r=>{
      const n=document.createElement('script');
      n.src=src; n.onload=()=>r(1); n.onerror=()=>r(0);
      document.head.appendChild(n);
    });
  }
  async function waitLib(){
    for(let i=0;i<40;i++){
      if(window.supabase && window.supabase.createClient) return true;
      await new Promise(r=>setTimeout(r,150));
    }
    await addScript('https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
    return !!(window.supabase && window.supabase.createClient);
  }

  async function connect(){
    if(!(await waitLib())) return { ok:false, reason:'lib' };
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    const { data } = await sb.auth.getSession();
    session = data.session || null;
    return { ok:true, session };
  }

  async function loadPrefs(){
    if(!session) return;
    try{
      const { data } = await sb.from('user_prefs').select('space,lang,theme,accent')
        .eq('email', session.user.email).maybeSingle();
      if(data){
        let changed = false;
        ['space','lang','theme','accent'].forEach(k=>{
          if(data[k] && !localStorage.getItem('pw-prefs')) { prefs[k]=data[k]; changed = true; }
        });
        if(changed){ writeLocal(); applyTheme(); }
      }
    }catch(e){}
  }

  function setPref(k, v){
    prefs[k] = v; writeLocal(); applyTheme();
    if(sb && session){
      sb.from('user_prefs').upsert({
        email: session.user.email, space: prefs.space, lang: prefs.lang,
        theme: prefs.theme, accent: prefs.accent, updated_at: new Date().toISOString()
      }).then(()=>{}, ()=>{});
    }
  }

  async function signIn(email){
    const url = location.href.split('#')[0].split('?')[0];
    return sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: url } });
  }
  async function signOut(){ if(sb) await sb.auth.signOut(); }

  /* A page that already made its own client can hand it over, so the
     preferences still sync to the user's account. */
  function adopt(client, sess){ sb = client; session = sess || null; }

  /* ---------- portal switcher + shared settings panel ---------- */
  const BASE = (function(){
    const m = location.pathname.match(/^(.*\/portal\/)/);
    return m ? m[1] : '/pweu/portal/';
  })();
  const PORTALS = [
    ['operations', 'pOperations', ''],
    ['sales',      'pSales',      'sales/'],
    ['customer',   'pCustomer',   'customer/']
  ];
  const ACCENTS = ['#00a65c','#2f7d55','#6b7f3a','#8a6a3b','#3a6b7d','#54595f'];
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function initials(em){
    const n = String(em||'?').split('@')[0].replace(/[._-]+/g,' ').trim().split(' ').filter(Boolean);
    return ((n[0]||'?')[0] + ((n[1]||'')[0]||'')).toUpperCase();
  }

  function portalsHtml(current){
    return '<h4>'+esc(t('portals'))+'</h4><div class="plist">'
      + PORTALS.map(([id,key,path]) =>
          '<a href="'+esc((window.__PW_LINKS && window.__PW_LINKS[id]) || (BASE+path))+'"'+(id===current?' aria-current="page"':'')+'>'+esc(t(key))+'</a>').join('')
      + '</div>';
  }

  /* o: { btn, panel, current, email, sub, top(), onLang(), admin, adminHref }
     Language, appearance, accent colour, portal switcher and sign out.
     English unless the user has chosen otherwise. */
  function mountSettings(o){
    o = o || {};
    const btn = document.getElementById(o.btn || 'userbtn');
    const p   = document.getElementById(o.panel || 'panel');
    if(!btn || !p) return;
    const who = () => o.email || (session ? session.user.email : '');

    function render(){
      p.innerHTML =
        '<div class="who"><b>'+esc(who())+'</b>'+(o.sub?'<span>'+esc(o.sub)+'</span>':'')+'</div>'
        + (o.top ? o.top() : '')
        + portalsHtml(o.current)
        + '<h4>'+esc(t('language'))+'</h4><select id="pw-lang">'
          + LANGS.map(([c,n]) => '<option value="'+c+'"'+(c===prefs.lang?' selected':'')+'>'+n+'</option>').join('')
          + '</select>'
        + '<h4>'+esc(t('appearance'))+'</h4><div class="seg3">'
          + [['system',t('system')],['light',t('light')],['dark',t('dark')]]
            .map(([v,l]) => '<button data-pwtheme="'+v+'" aria-pressed="'+(prefs.theme===v)+'">'+esc(l)+'</button>').join('')
          + '</div>'
        + '<h4>'+esc(t('accent'))+'</h4><div class="swatches">'
          + ACCENTS.map(c => '<button data-pwacc="'+c+'" style="background:'+c+'" aria-label="'+c+'" aria-pressed="'
              + ((prefs.accent||'').toLowerCase()===c)+'"></button>').join('')
          + '<input type="color" id="pw-acc" value="'+esc(prefs.accent||DEF.accent)+'"></div>'
        + (o.toggles ? '<h4>'+esc(t('displayH'))+'</h4>' + o.toggles.map(x => '<button class="tgl" data-pwtgl="'+x.key+'" aria-pressed="'+(prefs[x.key] !== false)+'"><span>'+esc(x.label)+'</span><i></i></button>').join('') : '')
        + '<div class="foot">'
          + (o.admin ? '<button id="pw-admin">Administration</button>' : '')
          + '<button id="pw-out">'+esc(t('signout'))+'</button></div>';

      p.querySelector('#pw-lang').onchange = e => {
        setPref('lang', e.target.value);
        document.documentElement.lang = e.target.value;
        render();
        if(o.onLang) o.onLang();
      };
      p.querySelectorAll('[data-pwtheme]').forEach(b => b.onclick = () => { setPref('theme', b.dataset.pwtheme); render(); });
      p.querySelectorAll('[data-pwacc]').forEach(b => b.onclick = () => { setPref('accent', b.dataset.pwacc); render(); });
      p.querySelector('#pw-acc').oninput = e => setPref('accent', e.target.value);
      p.querySelectorAll('[data-pwtgl]').forEach(b => b.onclick = () => { const k = b.dataset.pwtgl; setPref(k, prefs[k] === false); render(); if(o.onChange) o.onChange(k); });
      const a = p.querySelector('#pw-admin');
      if(a) a.onclick = () => { location.href = o.adminHref || (BASE + 'admin.html'); };
      p.querySelector('#pw-out').onclick = async () => { await signOut(); location.reload(); };
    }

    function toggle(open){
      const show = open === undefined ? !p.classList.contains('open') : open;
      p.classList.toggle('open', show);
      btn.setAttribute('aria-expanded', String(show));
    }

    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.onclick = e => { e.stopPropagation(); toggle(); };
    p.onclick = e => e.stopPropagation();
    document.addEventListener('click', () => toggle(false));
    document.addEventListener('keydown', e => { if(e.key === 'Escape') toggle(false); });
    render();
    return { render, toggle };
  }

  readLocal();
  applyTheme();
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if(mq.addEventListener) mq.addEventListener('change', ()=>{ if(prefs.theme==='system') applyTheme(); });
  }

  return {
    LANGS, T, t, prefs, setPref, applyTheme, resolved,
    connect, loadPrefs, signIn, signOut, adopt,
    BASE, PORTALS, initials, portalsHtml, mountSettings,
    get sb(){ return sb; },
    get session(){ return session; },
    get email(){ return session ? session.user.email : null; }
  };
})();
</script>
<script>/* ============================================================
   Precious Woods · Sales and Customer portals
   Same login, preferences and settings panel as the Operations
   portal (shared.js). Each portal is a thin page that calls
   PWLite.boot('sales') or PWLite.boot('customer').

   Anything still missing is shown as a dashed "TODO" box that says
   exactly which information is needed, so it can be filled in later.
   ============================================================ */
window.PWLite = (function () {

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const t = (...a) => PW.t(...a);

  /* ---------- what each portal contains ---------- */
  const CFG = {
    sales:    { title: 'pSales',    side: true,  price: true,  avail: true,  order: true,  focus: true,
                tabs: ['home', 'catalogue', 'neworder', 'contractform', 'customerform', 'myorders', 'calendar', 'invoices', 'downloads', 'showroom'] },
    customer: { title: 'pCustomer', side: false, price: false, avail: false, order: false, focus: false,
                tabs: ['home', 'catalogue', 'orders', 'documents', 'contact'] }
  };
  const LABEL  = { home:'home', catalogue:'catalogue', pricing:'priceLists', pipeline:'pipeline', customers:'customersTab',
                   flow:'flow', library:'documents', orders:'orders', documents:'documents', contact:'contact', neworder:'newOrder', contractform:'newContractForm', customerform:'newCustomerForm', myorders:'myOrders', calendar:'calendar', invoices:'openInvoices', downloads:'downloads', showroom:'showroom' };
  const STATUS = { home:null, catalogue:'ready', pricing:'todo', pipeline:'todo', customers:'todo', flow:'ready',
                   library:'ready', orders:'todo', documents:'todo', contact:'todo', neworder:'ready', contractform:'ready', customerform:'ready', myorders:'ready', calendar:'ready', invoices:'todo', downloads:'todo', showroom:'ready' };

  /* embedded forms follow the portal's light/dark theme and accent, now and when the user changes them */
  let FRAME_OBS = null;
  function watchFrame(fr){
    const sync = () => { try{
      const d = fr.contentDocument; if(!d || !d.documentElement) return;
      const r = document.documentElement;
      d.documentElement.setAttribute('data-theme', r.getAttribute('data-theme') || 'auto');
      const ac = r.style.getPropertyValue('--accent'); if(ac) d.documentElement.style.setProperty('--accent', ac);
    }catch(e){} };
    fr.addEventListener('load', () => { sync(); setTimeout(sync, 600); setTimeout(sync, 2000); });
    if(FRAME_OBS) FRAME_OBS.disconnect();
    FRAME_OBS = new MutationObserver(sync);
    FRAME_OBS.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'style'] });
  }
  /* forms are resolved from where this script itself was loaded (…/portal/portal-lite.js), so the path is right
     whatever the page address looks like (with or without trailing slash, index.html, query or hash) */
  const FORM_BASE = (() => { try{ const cs = document.currentScript; return cs && cs.src ? new URL('forms/', cs.src).href : '../forms/'; }catch(e){ return '../forms/'; } })();
  const FORMS = { contractform: FORM_BASE + 'contract-request.html', customerform: FORM_BASE + 'customer-request.html' };

  /* ---------- species catalogue (public technical data, no volumes) ---------- */
  /* applications: the Excel only has the EN 335 use class, so the applications are derived from it
     (indicative). Each application lists the use classes it is typically used in. Real per-species applications
     can be added in species-extra.json ("applications": [...]) and are matched by name. */
  const APP_LIST = [['ap0', [1, 2]], ['ap1', [1, 2]], ['ap2', [1, 2, 3]], ['ap3', [2, 3]], ['ap4', [3, 4]], ['ap5', [3, 4]], ['ap6', [3, 4]], ['ap7', [3, 4]], ['ap8', [4, 5]], ['ap9', [3, 4]], ['ap10', [4, 5]], ['ap11', [5]],
    ['ap12', [3, 4]], ['ap13', [3, 4]], ['ap14', [4]], ['ap15', [3, 4]], ['ap16', [2, 3]], ['ap17', [3, 4]], ['ap18', [1, 2]], ['ap19', [3, 4]]];
  const APP_IDS = APP_LIST.map(a => a[0]);
  function classesOf(uc){
    if(!uc) return [];
    let x = String(uc).replace(/(\d)\.\d/g, '$1');
    const set = new Set();
    x.replace(/(\d)\s*-\s*(\d)/g, (m, a, b) => { for(let i = +a; i <= +b; i++) set.add(i); return ''; });
    (x.match(/\d/g) || []).forEach(d => set.add(+d));
    return [...set].filter(n => n >= 1 && n <= 5).sort();
  }
  const appsOf = uc => { const c = classesOf(uc); return APP_LIST.filter(([, cl]) => cl.some(n => c.includes(n))).map(([k]) => k); };

  async function loadSpecies(){
    if(SP || SPERR) return;
    try{
      const r = await fetch('../data/species.json', { cache: 'no-cache' });
      if(!r.ok) throw new Error(r.status);
      SP = (await r.json()).species || [];
    }catch(e){ SPERR = true; return; }
    let X = {};
    let HID = new Set();
    try{ const rf = await fetch('../data/featured.json', { cache: 'no-cache' }); if(rf.ok){ const jf = await rf.json(); FEAT = { popular: jf.popular || [], lesser: jf.lesser || [] }; HID = new Set(jf.hidden || []); } }catch(e){}
    try{   /* the Administration > Catalogue screen (table catalogue_settings) decides when it has data */
      const rs = PW.sb ? await PW.sb.from('catalogue_settings').select('code,published,tier,sort') : null;
      if(rs && !rs.error && rs.data && rs.data.length){
        const by = tier => rs.data.filter(r => r.tier === tier).sort((a, b) => (a.sort - b.sort) || a.code.localeCompare(b.code)).map(r => r.code);
        FEAT = { popular: by('popular'), lesser: by('lesser') };
        HID = new Set(rs.data.filter(r => r.published === false).map(r => r.code));
      }
    }catch(e){}
    if(CFG[ID].focus && !SORTSET){ SORT = 'popular'; SORTSET = true; }
    SP = SP.filter(s => !HID.has(s.code));
    try{
      const r2 = await fetch('../data/species-extra.json', { cache: 'no-cache' });
      if(r2.ok){ const j = await r2.json(); X = j.species || {}; SAMPLE = !!j.sample; }
    }catch(e){}
    SP.forEach(s => {
      const x = X[s.code] || {};
      s.price = (CFG[ID].price && x.price && typeof x.price.value === 'number') ? x.price : null;
      s.av = CFG[ID].avail ? (['stock', 'produce'].includes(x.availability) ? x.availability : 'na') : 'na';
      s.desc = x.description || '';
      const ex = Array.isArray(x.applications) ? x.applications : [];
      const ids = ex.filter(k => APP_IDS.includes(k));
      s.appN = ids.length ? ids : appsOf(s.useClass);
      s.appX = ex.filter(k => !APP_IDS.includes(k)).concat(Array.isArray(x.tags) ? x.tags : []);
      s.imgUrl = x.image || ('../data/img/' + s.code + '.jpg');
      const ip = FEAT.popular.indexOf(s.code), il = FEAT.lesser.indexOf(s.code);
      s.fp = ip >= 0 ? 'popular' : (il >= 0 ? 'lesser' : '');
      s.rank = ip >= 0 ? ip : (il >= 0 ? 100 + il : 1000);
      s.rankL = il >= 0 ? il : (ip >= 0 ? 100 + ip : 1000);
      s._hay = [s.name, s.botanical, s.cirad, s.code, s.colour, s.durability, s.useClass, s.strength, s.remark, s.desc,
                s.appX.join(' ')].join(' ').toLowerCase();
    });
  }

  /* an indicative swatch from the colour description in the data, never a photo */
  function swatch(c){
    if(!c) return null;
    const s = c.toLowerCase();
    let h = 30, sa = 10, l = 50;
    if(/purple/.test(s))                { h = 290; sa = 30; l = 32; }
    else if(/red/.test(s) && /brown/.test(s)) { h = 12; sa = 45; l = 30; }
    else if(/red/.test(s))              { h = 5;  sa = 60; l = 38; }
    else if(/pink/.test(s))             { h = 350; sa = 35; l = 65; }
    else if(/orange/.test(s))           { h = 26; sa = 70; l = 50; }
    else if(/yellow/.test(s) && /brown/.test(s)) { h = 36; sa = 45; l = 45; }
    else if(/yellow/.test(s))           { h = 46; sa = 65; l = 62; }
    else if(/cream|white/.test(s))      { h = 42; sa = 40; l = 88; }
    else if(/brown/.test(s))            { h = 26; sa = 35; l = 36; }
    if(/light/.test(s)) l = Math.min(92, l + 18);
    if(/dark/.test(s))  l = Math.max(12, l - 12);
    return 'hsl(' + h + ' ' + sa + '% ' + l + '%)';
  }


  /* ---- card pictures: generated illustrations per species and application (placeholders until real photos exist) ---- */
  const SCENE_OF = { ap0: 'floor', ap16: 'floor', ap1: 'bench', ap12: 'bench', ap6: 'deck', ap13: 'deck', ap14: 'deck', ap4: 'clad', ap7: 'clad', ap5: 'clad' };
  const SLIDE_KEY = { board: 'slideBoard', floor: 'slideFloor', deck: 'slideDeck', clad: 'slideClad', bench: 'slideBench' };
  const slidesOf = s => ['board'].concat([...new Set(s.appN.map(k => SCENE_OF[k]).filter(Boolean))].slice(0, 3));
  function drawScene(cv, rgb, kind){
    const W = cv.width, H = cv.height, g = cv.getContext('2d');
    const wood = (app, plank, ang) => { const c = document.createElement('canvas'); c.width = W; c.height = H; paintWood(c.getContext('2d'), W, H, rgb, app, plank, ang); return c; };
    const clip = (pts, tex) => { g.save(); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.clip(); g.drawImage(tex, 0, 0); g.restore(); };
    const grad = (y0, y1, c0, c1, h0, h1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, h0, W, h1 - h0); };
    if(kind === 'board'){
      g.drawImage(wood('floor', 34, -8), 0, 0);
      grad(0, H, 'rgba(255,255,255,.10)', 'rgba(0,0,0,.18)', 0, H);
    }else if(kind === 'floor'){
      grad(0, H, '#ece8df', '#d6d0c3', 0, H);
      g.fillStyle = '#bfd8e8'; g.fillRect(W * .62, H * .12, W * .24, H * .36); g.strokeStyle = '#fafafa'; g.lineWidth = 4; g.strokeRect(W * .62, H * .12, W * .24, H * .36);
      clip([[W * .1, H * .56], [W * .9, H * .56], [W, H], [0, H]], wood('floor', 20, 0));
      g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, H * .54, W, 4);
    }else if(kind === 'deck'){
      grad(0, H * .5, '#bcd9ee', '#eaf2f5', 0, H * .5);
      g.fillStyle = '#7fa66a'; g.fillRect(0, H * .42, W, H * .12);
      clip([[W * .06, H * .52], [W * .94, H * .52], [W, H], [0, H]], wood('deck', 18, 0));
      g.fillStyle = 'rgba(40,30,20,.75)';
      for(let i = 0; i < 6; i++){ g.fillRect(W * .08 + i * W * .17, H * .3, 5, H * .24); }
      g.fillRect(W * .06, H * .3, W * .88, 5);
    }else if(kind === 'clad'){
      g.drawImage(wood('clad', 22, 0), 0, 0);
      g.fillStyle = '#c9dbe6'; g.fillRect(W * .58, H * .2, W * .24, H * .42); g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 5; g.strokeRect(W * .58, H * .2, W * .24, H * .42);
      g.fillStyle = '#8f8b84'; g.fillRect(0, H * .9, W, H * .1);
    }else if(kind === 'bench'){
      grad(0, H, '#d5d8d4', '#b9bcb7', 0, H);
      const tex = wood('floor', 12, 0), slat = (x, y, w, h) => clip([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], tex);
      g.fillStyle = '#33302c'; g.fillRect(W * .2, H * .62, 7, H * .3); g.fillRect(W * .76, H * .62, 7, H * .3);
      slat(W * .16, H * .6, W * .68, H * .08); slat(W * .16, H * .7, W * .68, H * .08);
      slat(W * .16, H * .26, W * .68, H * .1); slat(W * .16, H * .39, W * .68, H * .1);
      g.fillStyle = '#33302c'; g.fillRect(W * .2, H * .26, 6, H * .4); g.fillRect(W * .77, H * .26, 6, H * .4);
    }
  }
  function paintSlide(ph){
    const s = SP.find(x => x.code === ph.dataset.code); if(!s) return;
    const cv = ph.querySelector('canvas'), list = slidesOf(s), i = +ph.dataset.i || 0, kind = list[i];
    cv.width = 480; cv.height = 200;
    drawScene(cv, toRgb(swatch(s.colour) || '#a0703c'), kind);
    const cap = ph.querySelector('.ph-cap'); if(cap) cap.textContent = t(SLIDE_KEY[kind]) + ' · ' + t('illus') + (list.length > 1 ? '  ' + (i + 1) + '/' + list.length : '');
    ph.querySelectorAll('.ph-n').forEach(b => b.hidden = list.length < 2);
  }

  const AVKEY = { stock: 'avStock', produce: 'avProduce', na: 'avNA' };
  function money(p){
    let v;
    try{ v = new Intl.NumberFormat(PW.prefs.lang, { style: 'currency', currency: p.currency || 'EUR', maximumFractionDigits: 0 }).format(p.value); }
    catch(e){ v = p.value + ' ' + (p.currency || ''); }
    return v + (p.unit ? ' / ' + p.unit : '');
  }

  function speciesCard(s){
    const row = (k, v, extra) => v ? '<div><dt>' + esc(t(k)) + '</dt><dd>' + esc(v) + (extra ? '<small>' + esc(extra) + '</small>' : '') + '</dd></div>' : '';
    const sw = swatch(s.colour);
    const all = s.appX.concat(s.appN.map(k => t(k))), apps = all.slice(0, 4);
    const commercial = CFG[ID].price || CFG[ID].avail;
    return '<article class="spc">'
      + '<div class="sp-ph" data-open="' + esc(s.code) + '" data-code="' + esc(s.code) + '" data-i="0"><canvas></canvas><button class="ph-n prev" data-dir="-1" aria-label="Previous">‹</button><button class="ph-n next" data-dir="1" aria-label="Next">›</button><span class="ph-cap"></span>'
      + '<img loading="lazy" src="' + esc(s.image || s.imgUrl) + '" alt="' + esc(s.name) + '" onerror="this.remove()">'
      + (CFG[ID].focus && s.fp ? '<span class="fp-b fp-' + s.fp + '">' + esc(t(s.fp === 'popular' ? 'focPopular' : 'focLesser')) + '</span>' : '')
      + (CFG[ID].avail ? '<span class="av-b av-' + s.av + '">' + esc(t(AVKEY[s.av])) + '</span>' : '') + '</div>'
      + '<div class="sp-b">'
      + '<p class="sp-rg">' + esc(s.code) + '</p>'
      + '<h3 data-open="' + esc(s.code) + '">' + esc(s.name) + '</h3>'
      + (s.botanical ? '<p class="sp-bot">' + esc(s.botanical) + '</p>' : '')
      + (s.cirad ? '<p class="sp-ci">' + esc(s.cirad) + '</p>' : '')
      + (priceOn() ? '<p class="sp-price' + (s.price ? '' : ' none') + '"><span>' + esc(t('price')) + '</span> ' + esc(s.price ? money(s.price) : t('priceNone')) + '</p>' : '')
      + (s.desc ? '<p class="sp-desc">' + esc(s.desc) + '</p>' : '')
      + (apps.length ? '<div class="sp-apps">' + apps.map(a => '<span>' + esc(a) + '</span>').join('') + (all.length > 4 ? '<span>+' + (all.length - 4) + '</span>' : '') + '</div>' : '')
      + '<div class="sp-act"><button class="view-s" data-open="' + esc(s.code) + '">' + esc(t('viewSheet')) + '</button>'
      + (CFG[ID].order ? '<button class="add-o' + (inCart(s.code) ? ' on' : '') + '" data-add="' + esc(s.code) + '">' + esc(inCart(s.code) ? t('inOrderRemove') : t('addToOrder')) + '</button>' : '') + '</div>'
      + '<dl>'
      + (s.colour ? '<div><dt>' + esc(t('colour')) + '</dt><dd>' + (sw ? '<i class="sw" style="background:' + sw + '"></i>' : '') + esc(s.colour) + '</dd></div>' : '')
      + row('sg', s.sg)
      + row('durability', s.durability)
      + row('useClass', s.useClass)
      + row('strength', s.strength, s.strengthSource ? t('source') + ': ' + s.strengthSource : '')
      + row('logDia', s.logs ? s.logs + ' ' + t('cm') : '')
      + row('sapwood', s.sapwood ? s.sapwood + ' ' + t('cm') : '')
      + row('remark', s.remark)
      + '</dl></div></article>';
  }

  function filtered(){
    const toks = Q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = (SP || []).filter(s => toks.every(w => s._hay.includes(w) || s.appN.some(k => t(k).toLowerCase().includes(w)))
      && (!APPS.length || APPS.some(k => s.appN.includes(k) || s.appX.some(x => x.toLowerCase() === t(k).toLowerCase())))
      && (!AV.length || AV.includes(s.av)));
    const byName = (a, b) => a.name.localeCompare(b.name);
    const byPrice = d => (a, b) => {
      const pa = a.price ? a.price.value : null, pb = b.price ? b.price.value : null;
      if(pa == null && pb == null) return byName(a, b);
      if(pa == null) return 1;
      if(pb == null) return -1;
      return (pa - pb) * d || byName(a, b);
    };
    list.sort(SORT === 'popular' ? (a, b) => (a.rank - b.rank) || byName(a, b) : SORT === 'lesser' ? (a, b) => (a.rankL - b.rankL) || byName(a, b) : SORT === 'za' ? (a, b) => byName(b, a) : SORT === 'low' ? byPrice(1) : SORT === 'high' ? byPrice(-1) : byName);
    return list;
  }
  function drawGrid(){
    const g = $('spgrid'); if(!g) return;
    const list = filtered();
    g.innerHTML = list.length ? list.map(speciesCard).join('') : none('noMatch');
    $('spcount').textContent = t('results', list.length, SP.length);
    g.onclick = e => {
      const nb = e.target.closest('[data-dir]');
      if(nb){ const ph = nb.closest('.sp-ph'), s = SP.find(x => x.code === ph.dataset.code), n = slidesOf(s).length;
        ph.dataset.i = (((+ph.dataset.i || 0) + (+nb.dataset.dir)) % n + n) % n; paintSlide(ph); return; }
      const o = e.target.closest('[data-open]'); if(o){ openSpecies(o.dataset.open); return; }
      const b = e.target.closest('[data-add]'); if(!b) return; toggleCart(b.dataset.add); drawGrid();
    };
    if(PHIO) PHIO.disconnect();
    PHIO = ('IntersectionObserver' in window) ? new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ PHIO.unobserve(en.target); paintSlide(en.target); } }), { rootMargin: '300px' }) : null;
    g.querySelectorAll('.sp-ph').forEach(ph => PHIO ? PHIO.observe(ph) : paintSlide(ph));
    const n = APPS.length, m = AV.length;
    const pick = (arr, f) => f(arr[0]) + (arr.length > 1 ? ' +' + (arr.length - 1) : '');
    const sm = $('appsum'); if(sm) sm.textContent = n ? pick(APPS, k => t(k)) : t('allApplications');
    const sa = $('avsum'); if(sa) sa.textContent = m ? pick(AV, v => t(AVKEY[v])) : t('allAvailability');
    document.querySelectorAll('[data-app]').forEach(b => b.setAttribute('aria-pressed', String(APPS.includes(b.dataset.app))));
    document.querySelectorAll('[data-avf]').forEach(b => b.setAttribute('aria-pressed', String(AV.includes(b.dataset.avf))));
    const dirty = Q || n || m;
    $('spclear').hidden = !dirty;
  }

  function slideImg(s, i, w, h){

    drawScene(cv, toRgb(swatch(s.colour) || '#a0703c'), slidesOf(s)[i]);

      + r('sg', s.sg) + r('durability', s.durability) + r('useClass', s.useClass) + r('strength', s.strength, s.strengthSource ? t('source') + ': ' + s.strengthSource : '')
      + r('logDia', s.logs ? s.logs + ' ' + t('cm') : '') + r('sapwood', s.sapwood ? s.sapwood + ' ' + t('cm') : '') + r('remark', s.remark);

  const allApps = s => s.appX.concat(s.appN.map(k => t(k)));
  function sheetCore(s, heroSrc, thumbs){
    const apps = allApps(s);
    return '<div class="sh-top"><div><p class="sp-rg">' + esc(s.code) + '</p><h2 class="sh-h">' + esc(s.name) + '</h2>'

  /* ---- Calendar of orders and shipments (first version) ---- */
  const CAL = { y: new Date().getFullYear(), m: new Date().getMonth(), st: [], cust: 'all', q: '', foc: false };
  async function renderCalendar(){
    $('content').innerHTML = '<p class="none">' + esc(t('checking')) + '</p>';
    await Promise.all([loadSpecies(), loadOrdersData()]);
    if(TAB !== 'calendar') return;
    const first = new Date(CAL.y, CAL.m, 1), days = new Date(CAL.y, CAL.m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const pad = n => String(n).padStart(2, '0'), key = d => CAL.y + '-' + pad(CAL.m + 1) + '-' + pad(d);
    const ev = {};
    const cq = CAL.q.trim().toLowerCase();
    const cnames = [...new Set(orders().map(o => o.custName || '').concat(custs().map(c => c.name)))].filter(Boolean).sort();
    orders().filter(o => (!CAL.st.length || CAL.st.includes(o.status)) && (CAL.cust === 'all' || o.custName === CAL.cust)
      && (!cq || [o.ref, o.custName, o.lines.map(l => nameOf(l.code)).join(' ')].join(' ').toLowerCase().includes(cq))).forEach(o => {
      const d = o.eta || o.date; (ev[d] = ev[d] || []).push(o);
    });
    const monthName = new Intl.DateTimeFormat(PW.prefs.lang, { month: 'long', year: 'numeric' }).format(first);
    const wd = [...Array(7)].map((_, i) => new Intl.DateTimeFormat(PW.prefs.lang, { weekday: 'short' }).format(new Date(2024, 0, 1 + i)));
    let cells = wd.map(w => '<div class="cal-wd">' + esc(w) + '</div>').join('') + '<div class="cal-e"></div>'.repeat(lead);
    let n = 0;
    for(let d = 1; d <= days; d++){
      const list = ev[key(d)] || []; n += list.length;
      cells += '<div class="cal-d"><span class="cal-n">' + d + '</span>' + list.map(o =>
        '<span class="cal-ev st-' + esc(o.status) + '" title="' + esc(o.ref + ' · ' + (o.custName || '') + ' · ' + t(ST[o.status] || 'stQuote')) + '">' + esc(o.ref) + (o.custName ? ' · ' + esc(o.custName) : '') + '</span>').join('') + '</div>';
    }
    $('content').innerHTML = '<section class="sec"><div class="sp-tools">'
      + '<button class="ghost2" id="calp" aria-label="Previous">‹</button><b class="cal-t">' + esc(monthName) + '</b><button class="ghost2" id="caln" aria-label="Next">›</button>'
      + '<button class="ghost2" id="calt">' + esc(t('todayWord')) + '</button>'
      + '<input id="calq" type="search" autocomplete="off" placeholder="' + esc(t('calSearchPh')) + '" aria-label="' + esc(t('calSearchPh')) + '" value="' + esc(CAL.q) + '">'
      + '<select id="calc" aria-label="' + esc(t('customer')) + '"><option value="all">' + esc(t('allCustomers')) + '</option>' + cnames.map(n => '<option value="' + esc(n) + '"' + (CAL.cust === n ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>'
      + '<details class="sp-dd" id="calsd"><summary id="calsum"></summary><div class="sp-dd-b">'
        + Object.keys(ST).map(k => '<button type="button" data-cst="' + k + '" aria-pressed="' + CAL.st.includes(k) + '">' + esc(t(ST[k])) + '</button>').join('') + '</div></details></div>'
      + '<div class="cal">' + cells + '</div>' + (n ? '' : none('noEvents')) + '</section>'
      + todo('Calendar: to connect', [
          'Real shipment dates (ETD / ETA from the shipping data) so "In transit" and "Partially delivered" show on the right days. For now an order shows on its "eta" date if it has one, otherwise on its order date.',
          'Invoice due dates and document deadlines, if the salesperson should monitor them here.',
          'Which orders each salesperson sees.'
        ]);
    $('calsum').textContent = CAL.st.length ? t('statusWord') + ' (' + CAL.st.length + ')' : t('allStatuses');
    const mv = d => { CAL.m += d; if(CAL.m < 0){ CAL.m = 11; CAL.y--; } if(CAL.m > 11){ CAL.m = 0; CAL.y++; } renderCalendar(); };
    $('calc').onchange = e => { CAL.cust = e.target.value; renderCalendar(); };
    let ct = null; const cqi = $('calq');
    cqi.oninput = () => { clearTimeout(ct); ct = setTimeout(() => { CAL.q = cqi.value; CAL.foc = true; renderCalendar(); }, 350); };
    if(CAL.foc){ CAL.foc = false; cqi.focus(); cqi.setSelectionRange(cqi.value.length, cqi.value.length); }
    $('calp').onclick = () => mv(-1); $('caln').onclick = () => mv(1);
    $('calt').onclick = () => { CAL.y = new Date().getFullYear(); CAL.m = new Date().getMonth(); renderCalendar(); };
    document.querySelectorAll('[data-cst]').forEach(b => b.onclick = () => { CAL.st = CAL.st.includes(b.dataset.cst) ? CAL.st.filter(x => x !== b.dataset.cst) : CAL.st.concat(b.dataset.cst); renderCalendar(); });
  }

  /* ============ 3D Showroom (first prototype: manual surface + generated wood texture) ============ */
  const SR_APPS = [['floor', 'ap0'], ['deck', 'ap6'], ['clad', 'ap4'], ['panel', 'srPanel']];
  function toRgb(css){
    const c = document.createElement('canvas'); c.width = c.height = 1; const x = c.getContext('2d');

  const shade = (rgb, k) => 'rgb(' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v * (1 + k))))).join(',') + ')';
  function paintWood(c, W, H, rgb, app, plank, angle){
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const D = Math.hypot(W, H);
    c.save(); c.translate(W / 2, H / 2); c.rotate((angle + (app === 'clad' ? 90 : 0)) * Math.PI / 180); c.translate(-D / 2, -D / 2);
    const rowH = app === 'panel' ? D : plank * (app === 'deck' ? 1.15 : 1), gap = app === 'deck' ? 4 : (app === 'clad' ? 2 : 1.2);
    const pieceL = app === 'panel' ? D : plank * (app === 'clad' ? 60 : 7);
    for(let y = 0; y < D; y += rowH){
      let x = -rnd() * pieceL;
      while(x < D){
        const len = app === 'panel' ? D : pieceL * (0.6 + rnd() * 0.6);
        c.fillStyle = shade(rgb, (rnd() - .5) * 0.18); c.fillRect(x, y, len, rowH);
        const n = Math.min(80, Math.max(3, Math.floor(rowH / 4)));
        for(let i = 0; i < n; i++){
          const gy = y + rnd() * rowH;
          c.strokeStyle = rnd() > .5 ? 'rgba(0,0,0,' + (.05 + rnd() * .1) + ')' : 'rgba(255,255,255,' + (.04 + rnd() * .06) + ')';
          c.lineWidth = .5 + rnd() * 1.2; c.beginPath(); c.moveTo(x, gy);
          const amp = Math.min(rowH * .05, 6) * rnd();
          for(let gx = x; gx <= x + len; gx += 24) c.lineTo(gx, gy + Math.sin(gx * .02 + i) * amp);
          c.stroke();
        }
        c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x, y, 1.2, rowH);
        x += len;
      }
      c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-D, y + rowH - gap, 3 * D, gap);
    }
    c.restore();
  }

    document.documentElement.lang = PW.prefs.lang;
    $('gatemsg').textContent = t('checking');

    const c = await PW.connect();
    if(!c.ok){
      gate(shell('<h2>' + esc(t('offlineT')) + '</h2><p>' + esc(t('offlineB')) + '</p>'
        + '<button onclick="location.reload()">' + esc(t('retry')) + '</button>'));
      wireLang(() => location.reload());
      return;
    }
    if(!c.session){ loginScreen(); return; }
    await PW.loadPrefs();
    document.documentElement.lang = PW.prefs.lang;

    if(ID === 'sales'){
      const [sp, se, dc] = await Promise.all([
        PW.sb.from('spaces').select('id,name,sort').order('sort'),
        PW.sb.from('sections').select('id,space,name,nav,sort').order('sort'),
        PW.sb.from('doc_index').select('*')
      ]);
      if(sp.error){ loginScreen(t('loadFail', sp.error.message)); return; }
      SPACES = sp.data || []; SECTIONS = se.data || []; DOCS = dc.data || [];
      if(!SPACES.length){ noAccessScreen(); return; }
    }

    if(ID === 'sales') await loadOrdersData();
    ungate(); $('main').hidden = false;
    if(CFG[ID].focus || CFG[ID].price){ const hs = hashSpecies(); if(hs){ DETAIL = hs; TAB = 'catalogue'; } }
    window.addEventListener('popstate', () => { const hs = hashSpecies(); DETAIL = hs; if(hs) TAB = 'catalogue'; buildNav(); chrome(); render(); });
    redraw();
    PW.mountSettings({ current: ID, onLang: redraw, toggles: ID === 'sales' ? [{ key: 'showPrice', label: t('showPrices') }, { key: 'scCatalogue', label: t('scTCat') }, { key: 'scStock', label: t('scTStock') }, { key: 'scNewOrder', label: t('scTNew') }, { key: 'tabCalendar', label: t('tabTCal') }, { key: 'tabInvoices', label: t('tabTInv') }, { key: 'tabDownloads', label: t('tabTDl') }, { key: 'tabShowroom', label: t('tabTShow') }] : (CFG[ID].price ? [{ key: 'showPrice', label: t('showPrices') }] : null), onChange: redraw });
  }

  return { boot };
})();
</script>
<script>PWLite.boot('sales');</script>
